<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cảnh báo an ninh - kiGuard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.15);
            --border: #1f2937;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Glassmorphism background design */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.15) 0%, transparent 70%);
            top: 10%;
            left: 15%;
            z-index: -1;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
            bottom: 10%;
            right: 15%;
            z-index: -1;
        }

        .container {
            max-width: 620px;
            width: 90%;
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .icon-container {
            width: 96px;
            height: 96px;
            background: var(--danger-glow);
            border: 2px solid rgba(239, 68, 68, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            color: var(--danger);
            position: relative;
        }

        .icon-container svg {
            width: 48px;
            height: 48px;
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 16px;
            background: linear-gradient(135deg, #fff 40%, #fca5a5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .alert-box {
            background-color: rgba(239, 68, 68, 0.05);
            border: 1px dashed rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 24px;
            display: inline-block;
        }

        .domain-name {
            font-family: monospace;
            color: #fca5a5;
            font-size: 16px;
            font-weight: bold;
            word-break: break-all;
        }

        p.description {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin: 0 0 32px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            padding: 16px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            box-shadow: 0 8px 20px -6px rgba(239, 68, 68, 0.5);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -6px rgba(239, 68, 68, 0.6);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            border-color: #374151;
        }

        .footer {
            margin-top: 36px;
            font-size: 13px;
            color: #4b5563;
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .footer a {
            color: #6b7280;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: var(--text-secondary);
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        @media (min-width: 640px) {
            .actions {
                flex-direction: row;
            }
            .btn-primary {
                flex: 1.8;
            }
            .btn-secondary {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-container">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>
        <h1>Website Bị Chặn</h1>
        
        <div class="alert-box">
            <span class="domain-name" id="domain-display">Đang tải...</span>
        </div>

        <p class="description">
            Hệ thống <strong>kiGuard Detector</strong> đã phát hiện trang web này nằm trong danh sách đen (lừa đảo, cá độ bất hợp pháp, giả mạo thương hiệu hoặc phát tán mã độc). Hãy bảo vệ thông tin cá nhân và tài sản của bạn.
        </p>

        <div class="actions">
            <button class="btn btn-primary" id="btn-back">Quay lại an toàn</button>
            <button class="btn btn-secondary" id="btn-continue">Vẫn tiếp tục truy cập</button>
        </div>

        <div class="footer">
            <span>Powered by kiGuard</span>
            <span>&bull;</span>
            <a href="https://kiguard.vn" target="_blank">Trang chủ</a>
            <span>&bull;</span>
            <a href="#" id="link-report">Báo cáo nhầm lẫn</a>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
