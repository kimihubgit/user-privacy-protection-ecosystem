    <script>
        const rawMarkdown = "# B\u00c1O C\u00c1O \u0110\u1ec0 T\u00c0I: NGHI\u00caN C\u1ee8U V\u00c0 X\u00c2Y D\u1ef0NG H\u1ec6 SINH TH\u00c1I B\u1ea2O V\u1ec6 NG\u01af\u1edcI D\u00d9NG V\u00c0 \u0110\u1ea2M B\u1ea2O QUY\u1ec0N RI\u00caNG T\u01af (KIGUARD ECOSYSTEM)\n\n---\n\n## \ud83d\udccc B\u1ea2NG T\u1ed4NG H\u1ee2P MAPPING S\u1eec D\u1ee4NG S\u01a0 \u0110\u1ed2 TRONG C\u00c1C CH\u01af\u01a0NG\n\n| STT | T\u00ean lo\u1ea1i s\u01a1 \u0111\u1ed3 (Diagram Type) | Chu\u1ea9n s\u01a1 \u0111\u1ed3 | V\u1ecb tr\u00ed xu\u1ea5t hi\u1ec7n trong b\u00e0i | M\u1ee5c \u0111\u00edch ph\u00e2n t\u00edch |\n| :---: | :--- | :---: | :--- | :--- |\n| **1** | **S\u01a1 \u0111\u1ed3 T\u00e1c nh\u00e2n (Actor Graph)** | UML | **Ch\u01b0\u01a1ng II - M\u1ee5c 2.1** | Ph\u00e2n r\u00e3 5 nh\u00f3m t\u00e1c nh\u00e2n v\u00e0 m\u00f4 h\u00ecnh k\u1ebf th\u1eeba t\u00e1c nh\u00e2n con (Web, Extension, Bot). |\n| **2** | **S\u01a1 \u0111\u1ed3 Ca S\u1eed D\u1ee5ng (Use Case Diagram)** | UML | **Ch\u01b0\u01a1ng II - M\u1ee5c 2.2** | M\u00f4 t\u1ea3 c\u00e1c t\u00ednh n\u0103ng ph\u00e2n h\u1ec7 (Client Shield, Web Portal, Admin Dashboard). |\n| **3** | **S\u01a1 \u0111\u1ed3 Ki\u1ebfn tr\u00fac (Architecture Diagram)** | Architecture | **Ch\u01b0\u01a1ng III - M\u1ee5c 3.1** | M\u00f4 t\u1ea3 c\u1ea5u tr\u00fac c\u00e1c l\u1edbp h\u1ec7 th\u1ed1ng (Client, Gateway, AI Service, Database). |\n| **4** | **S\u01a1 \u0111\u1ed3 Lu\u1ed3ng K\u1ef9 thu\u1eadt (Flowchart Diagram)** | Flowchart | **Ch\u01b0\u01a1ng III - M\u1ee5c 3.2** | M\u00f4 t\u1ea3 thu\u1eadt to\u00e1n qu\u00e9t 2 t\u1ea7ng (Cuckoo RAM + AI Fallback + Async Batch Worker). |\n| **5** | **S\u01a1 \u0111\u1ed3 Quy tr\u00ecnh Nghi\u1ec7p v\u1ee5 (BPMN Diagram)** | BPMN 2.0 | **Ch\u01b0\u01a1ng III - M\u1ee5c 3.3** | Ph\u00e2n chia l\u00e0n ranh gi\u1edbi tr\u00e1ch nhi\u1ec7m (5 Swimlanes) trong x\u1eed l\u00fd \u0111\u01a1n b\u00e1o c\u00e1o l\u1eeba \u0111\u1ea3o. |\n| **6** | **S\u01a1 \u0111\u1ed3 Tu\u1ea7n t\u1ef1 (Sequence Diagram)** | UML | **Ch\u01b0\u01a1ng III - M\u1ee5c 3.4** | Tr\u00ecnh di\u1ec5n lu\u1ed3ng t\u01b0\u01a1ng t\u00e1c th\u1eddi gian th\u1ef1c (X\u00e1c th\u1ef1c Passkey & Qu\u00e9t URL). |\n| **7** | **S\u01a1 \u0111\u1ed3 Ho\u1ea1t \u0111\u1ed9ng (Activity Diagram)** | UML | **Ch\u01b0\u01a1ng III - M\u1ee5c 3.5** | M\u00f4 t\u1ea3 lu\u1ed3ng x\u1eed l\u00fd c\u00e2u h\u1ecfi v\u00e0 truy h\u1ed3i lu\u1eadt t\u01b0\u01a1ng \u0111\u1ed3ng ng\u1eef c\u1ea3nh c\u1ee7a RAG Chatbot. |\n| **8** | **S\u01a1 \u0111\u1ed3 Th\u1ef1c th\u1ec3 Quan h\u1ec7 (ERD Diagram)** | ERD / NoSQL | **Ch\u01b0\u01a1ng III - M\u1ee5c 3.6** | Thi\u1ebft k\u1ebf CSDL MongoDB (Chi\u1ebfn l\u01b0\u1ee3c Nh\u00fang Embedding vs Tham chi\u1ebfu Referencing). |\n| **9** | **S\u01a1 \u0111\u1ed3 Chuy\u1ec3n Tr\u1ea1ng th\u00e1i (State Machine)** | UML | **Ch\u01b0\u01a1ng III - M\u1ee5c 3.7** | M\u00f4 t\u1ea3 to\u00e0n b\u1ed9 v\u00f2ng \u0111\u1eddi tr\u1ea1ng th\u00e1i c\u1ee7a \u0111\u01a1n b\u00e1o c\u00e1o v\u00e0 t\u00ean mi\u1ec1n l\u1eeba \u0111\u1ea3o. |\n\n---\n\n## M\u1ede \u0110\u1ea6U\n\n### 1. T\u00ednh c\u1ea5p thi\u1ebft c\u1ee7a \u0111\u1ec1 t\u00e0i\nTrong k\u1ef7 nguy\u00ean s\u1ed1 h\u00f3a m\u1ea1nh m\u1ebd, kh\u00f4ng gian m\u1ea1ng \u0111\u00e3 tr\u1edf th\u00e0nh m\u00f4i tr\u01b0\u1eddng ho\u1ea1t \u0111\u1ed9ng ch\u00ednh c\u1ee7a nhi\u1ec1u c\u00e1 nh\u00e2n v\u00e0 t\u1ed5 ch\u1ee9c. Tuy nhi\u00ean, s\u1ef1 ph\u00e1t tri\u1ec3n n\u00e0y c\u0169ng k\u00e9o theo s\u1ef1 gia t\u0103ng nhanh ch\u00f3ng c\u1ee7a c\u00e1c m\u1ed1i \u0111e d\u1ecda an ninh m\u1ea1ng nguy hi\u1ec3m. C\u00e1c cu\u1ed9c t\u1ea5n c\u00f4ng l\u1eeba \u0111\u1ea3o tr\u1ef1c tuy\u1ebfn (Phishing), trang web gi\u1ea3 m\u1ea1o (Scam URLs) v\u00e0 h\u00e0nh vi thu th\u1eadp tr\u00e1i ph\u00e9p th\u00f4ng tin c\u00e1 nh\u00e2n (PII - Personally Identifiable Information) \u0111ang ng\u00e0y c\u00e0ng tinh vi v\u00e0 nh\u1eafm v\u00e0o nh\u1eefng ng\u01b0\u1eddi d\u00f9ng cu\u1ed1i thi\u1ebfu ki\u1ebfn th\u1ee9c b\u1ea3o m\u1eadt.\n\nB\u00ean c\u1ea1nh \u0111\u00f3, vi\u1ec7c ng\u01b0\u1eddi d\u00f9ng l\u01b0\u1edbt web h\u00e0ng ng\u00e0y \u0111ang ph\u1ea3i \u0111\u1ed1i m\u1eb7t v\u1edbi c\u00e1c v\u1ea5n \u0111\u1ec1 r\u00f2 r\u1ec9 d\u1eef li\u1ec7u qua c\u00e1c c\u00f4ng c\u1ee5 d\u1ecbch thu\u1eadt t\u1ef1 \u0111\u1ed9ng c\u1ee7a b\u00ean th\u1ee9 ba, c\u00e1c k\u1ecbch b\u1ea3n clickjacking, c\u0169ng nh\u01b0 c\u00e1c b\u1ed9 theo d\u00f5i h\u00e0nh vi (trackers) v\u00e0 qu\u1ea3ng c\u00e1o b\u1ea9n tr\u00e0n lan tr\u00ean m\u1ea1ng x\u00e3 h\u1ed9i l\u1edbn nh\u01b0 Facebook. Nh\u1eadn th\u1ea5y c\u00e1c gi\u1ea3i ph\u00e1p b\u1ea3o m\u1eadt hi\u1ec7n nay th\u01b0\u1eddng r\u1eddi r\u1ea1c, ch\u01b0a t\u1ed1i \u01b0u h\u00f3a hi\u1ec7u n\u0103ng th\u1eddi gian th\u1ef1c v\u00e0 ch\u01b0a t\u00edch h\u1ee3p b\u1ea3o v\u1ec7 quy\u1ec1n ri\u00eang t\u01b0 t\u1ea1i bi\u00ean (client-side), \u0111\u1ec1 t\u00e0i **\"H\u1ec7 sinh th\u00e1i b\u1ea3o v\u1ec7 ng\u01b0\u1eddi d\u00f9ng v\u00e0 \u0111\u1ea3m b\u1ea3o quy\u1ec1n ri\u00eang t\u01b0 (KiGuard Ecosystem)\"** \u0111\u01b0\u1ee3c l\u1ef1a ch\u1ecdn nghi\u00ean c\u1ee9u nh\u1eb1m t\u1ea1o ra m\u1ed9t gi\u1ea3i ph\u00e1p ph\u00f2ng th\u1ee7 \u0111a n\u1ec1n t\u1ea3ng, to\u00e0n di\u1ec7n v\u00e0 t\u1ed1i \u01b0u cho ng\u01b0\u1eddi s\u1eed d\u1ee5ng.\n\n### 2. M\u1ee5c ti\u00eau nghi\u00ean c\u1ee9u\n*   X\u00e2y d\u1ef1ng m\u1ed9t h\u1ec7 sinh th\u00e1i an ninh m\u1ea1ng \u0111a n\u1ec1n t\u1ea3ng bao g\u1ed3m: Ti\u1ec7n \u00edch tr\u00ecnh duy\u1ec7t (Chrome Extension), Chatbot h\u1ed7 tr\u1ee3, Telegram Bot v\u00e0 Trang qu\u1ea3n tr\u1ecb Web.\n*   Thi\u1ebft k\u1ebf c\u00f4ng c\u1ee5 l\u1ecdc URL \u0111\u1ed9c h\u1ea1i th\u1eddi gian th\u1ef1c v\u1edbi \u0111\u1ed9 tr\u1ec5 c\u1ef1c th\u1ea5p s\u1eed d\u1ee5ng b\u1ed9 l\u1ecdc x\u00e1c su\u1ea5t **Cuckoo Filter** k\u1ebft h\u1ee3p c\u01a1 ch\u1ebf ghi log b\u1ea5t \u0111\u1ed3ng b\u1ed9 (**Asynchronous Batch Logging**).\n*   \u1ee8ng d\u1ee5ng m\u00f4 h\u00ecnh ng\u00f4n ng\u1eef l\u1edbn (LLM - Gemini API) v\u00e0o ph\u00e2n t\u00edch \u0111\u1ed9ng website l\u1eeba \u0111\u1ea3o (AI Phishing Detector) v\u00e0 t\u01b0 v\u1ea5n lu\u1eadt an ninh m\u1ea1ng (AI ANM Chatbot) s\u1eed d\u1ee5ng k\u1ef9 thu\u1eadt **RAG (Retrieval-Augmented Generation)**.\n*   B\u1ea3o v\u1ec7 d\u1eef li\u1ec7u ri\u00eang t\u01b0 t\u1ea1i bi\u00ean b\u1eb1ng c\u01a1 ch\u1ebf t\u1ef1 \u0111\u1ed9ng ph\u00e1t hi\u1ec7n v\u00e0 l\u00e0m m\u1edd th\u00f4ng tin PII, ch\u1eb7n theo d\u00f5i WebSocket, ng\u0103n r\u00f2 r\u1ec9 d\u1ecbch thu\u1eadt v\u00e0 ki\u1ec3m so\u00e1t th\u1eddi gian s\u1eed d\u1ee5ng thi\u1ebft b\u1ecb s\u1ed1.\n\n---\n\n## CH\u01af\u01a0NG I: C\u01a0 S\u1ede L\u00dd THUY\u1ebeT V\u00c0 C\u00d4NG NGH\u1ec6 S\u1eec D\u1ee4NG\n\n### 1.1. T\u1ed5ng quan v\u1ec1 An ninh m\u1ea1ng v\u00e0 B\u1ea3o v\u1ec7 Quy\u1ec1n ri\u00eang t\u01b0 Ng\u01b0\u1eddi d\u00f9ng\n\n#### 1.1.1. C\u00e1c h\u00ecnh th\u1ee9c t\u1ea5n c\u00f4ng l\u1eeba \u0111\u1ea3o tr\u1ef1c tuy\u1ebfn (Phishing & Cyber Scams)\nT\u1ea5n c\u00f4ng l\u1eeba \u0111\u1ea3o tr\u1ef1c tuy\u1ebfn (**Phishing**) l\u00e0 m\u1ed9t h\u00ecnh th\u1ee9c t\u1ea5n c\u00f4ng d\u1ef1a tr\u00ean k\u1ef9 thu\u1eadt x\u00e3 h\u1ed9i (Social Engineering), trong \u0111\u00f3 k\u1ebb t\u1ea5n c\u00f4ng gi\u1ea3 m\u1ea1o th\u00e0nh c\u00e1c t\u1ed5 ch\u1ee9c uy t\u00edn (ng\u00e2n h\u00e0ng, c\u01a1 quan nh\u00e0 n\u01b0\u1edbc, m\u1ea1ng x\u00e3 h\u1ed9i) nh\u1eb1m l\u1eeba \u0111\u1ea3o ng\u01b0\u1eddi d\u00f9ng cung c\u1ea5p th\u00f4ng tin nh\u1ea1y c\u1ea3m nh\u01b0 t\u00ean \u0111\u0103ng nh\u1eadp, m\u1eadt kh\u1ea9u, m\u00e3 OTP ho\u1eb7c th\u00f4ng tin th\u1ebb t\u00edn d\u1ee5ng.\n*   **Typosquatting & Homograph Attack**: K\u1ebb t\u1ea5n c\u00f4ng \u0111\u0103ng k\u00fd c\u00e1c t\u00ean mi\u1ec1n g\u1ea7n gi\u1ed1ng v\u1edbi t\u00ean mi\u1ec1n h\u1ee3p ph\u00e1p (v\u00ed d\u1ee5: `g00gle.com`, `paypal-security.net` ho\u1eb7c d\u00f9ng k\u00fd t\u1ef1 Cyrillic gi\u1ed1ng h\u1ec7t k\u00fd t\u1ef1 Latinh) khi\u1ebfn ng\u01b0\u1eddi d\u00f9ng kh\u00f4ng th\u1ec3 ph\u00e2n bi\u1ec7t b\u1eb1ng m\u1eaft th\u01b0\u1eddng.\n*   **Malicious Redirection & Clickjacking**: K\u1ebf th\u1eeba k\u1ecbch b\u1ea3n ch\u00e8n c\u00e1c \u0111o\u1ea1n m\u00e3 JavaScript \u0111\u1ed9c h\u1ea1i ho\u1eb7c ch\u00e8n khung \u1ea9n (`<iframe>`) \u0111\u00e8 l\u00ean giao di\u1ec7n trang web h\u1ee3p ph\u00e1p \u0111\u1ec3 l\u1eeba ng\u01b0\u1eddi d\u00f9ng nh\u1ea5p chu\u1ed9t v\u00e0o c\u00e1c li\u00ean k\u1ebft \u0111\u1ed9c h\u1ea1i.\n\n#### 1.1.2. Th\u00e1ch th\u1ee9c b\u1ea3o m\u1eadt d\u1eef li\u1ec7u c\u00e1 nh\u00e2n t\u1ea1i bi\u00ean (Client-side Privacy & PII Protection)\nKhi l\u01b0\u1edbt web h\u00e0ng ng\u00e0y, th\u00f4ng tin nh\u1eadn d\u1ea1ng c\u00e1 nh\u00e2n (**PII - Personally Identifiable Information**) c\u1ee7a ng\u01b0\u1eddi d\u00f9ng nh\u01b0 s\u1ed1 CCCD, s\u1ed1 th\u1ebb ng\u00e2n h\u00e0ng, s\u1ed1 \u0111i\u1ec7n tho\u1ea1i, m\u1eadt kh\u1ea9u th\u01b0\u1eddng xuy\u00ean b\u1ecb l\u1ed9 qua c\u00e1c h\u00ecnh th\u1ee9c:\n*   **D\u1ecbch thu\u1eadt t\u1ef1 \u0111\u1ed9ng c\u1ee7a b\u00ean th\u1ee9 ba**: Khi tr\u00ecnh duy\u1ec7t s\u1eed d\u1ee5ng c\u00e1c c\u00f4ng c\u1ee5 d\u1ecbch trang t\u1ef1 \u0111\u1ed9ng, to\u00e0n b\u1ed9 v\u0103n b\u1ea3n trong c\u00e1c \u00f4 nh\u1eadp li\u1ec7u nh\u1ea1y c\u1ea3m s\u1ebd b\u1ecb g\u1eedi v\u1ec1 m\u00e1y ch\u1ee7 c\u1ee7a nh\u00e0 cung c\u1ea5p d\u1ecbch v\u1ee5 d\u1ecbch thu\u1eadt m\u00e0 ng\u01b0\u1eddi d\u00f9ng kh\u00f4ng h\u1ec1 hay bi\u1ebft.\n*   **B\u1ed9 theo d\u00f5i h\u00e0nh vi (Ad Trackers & Web Sockets)**: C\u00e1c m\u1ea1ng x\u00e3 h\u1ed9i l\u1edbn v\u00e0 \u0111\u1ed1i t\u00e1c qu\u1ea3ng c\u00e1o nh\u00fang c\u00e1c k\u1ecbch b\u1ea3n theo d\u00f5i (Tracking Scripts) \u0111\u1ec3 c\u00e0o d\u1eef li\u1ec7u h\u00e0nh vi, l\u1ecbch s\u1eed nh\u1ea5p chu\u1ed9t v\u00e0 c\u00e1c g\u00f3i tin trao \u0111\u1ed5i qua k\u1ebft n\u1ed1i WebSocket th\u1eddi gian th\u1ef1c.\n*   **Chu\u1ea9n ki\u1ec3m so\u00e1t quy\u1ec1n ri\u00eang t\u01b0 to\u00e0n c\u1ea7u (GPC - Global Privacy Control)**: Chu\u1ea9n k\u1ef9 thu\u1eadt quy \u0111\u1ecbnh tr\u00ecnh duy\u1ec7t g\u1eedi t\u00edn hi\u1ec7u `Sec-GPC: 1` trong HTTP Header \u0111\u1ec3 y\u00eau c\u1ea7u trang web kh\u00f4ng \u0111\u01b0\u1ee3c b\u00e1n ho\u1eb7c chia s\u1ebb d\u1eef li\u1ec7u c\u00e1 nh\u00e2n c\u1ee7a ng\u01b0\u1eddi d\u00f9ng.\n\n---\n\n### 1.2. C\u00f4ng ngh\u1ec7 X\u00e1c th\u1ef1c Kh\u00f4ng M\u1eadt Kh\u1ea9u WebAuthn / Passkey v\u00e0 JWT RSA\n\n#### 1.2.1. Chu\u1ea9n x\u00e1c th\u1ef1c sinh tr\u1eafc h\u1ecdc WebAuthn (FIDO2 / Passkey)\nC\u01a1 ch\u1ebf x\u00e1c th\u1ef1c truy\u1ec1n th\u1ed1ng d\u1ef1a tr\u00ean M\u1eadt kh\u1ea9u (Password) b\u1ed9c l\u1ed9 nhi\u1ec1u l\u1ed7 h\u1ed5ng nghi\u00eam tr\u1ecdng. **WebAuthn (Web Authentication API)** l\u00e0 m\u1ed9t ti\u00eau chu\u1ea9n m\u1edf to\u00e0n c\u1ea7u thu\u1ed9c t\u1eadp chu\u1ea9n FIDO2 do W3C v\u00e0 Li\u00ean minh FIDO ban h\u00e0nh, cho ph\u00e9p ng\u01b0\u1eddi d\u00f9ng \u0111\u0103ng nh\u1eadp b\u1eb1ng sinh tr\u1eafc h\u1ecdc (v\u00e2n tay, khu\u00f4n m\u1eb7t) ho\u1eb7c kh\u00f3a b\u1ea3o m\u1eadt v\u1eadt l\u00fd.\n\n```\n+-------------------+             +------------------+             +-------------------+\n|  Client Browser   |             |   Backend Auth   |             |   MongoDB Store   |\n| (WebAuthn API)    |             |   (Golang API)   |             | (Public Key Repo) |\n+-------------------+             +------------------+             +-------------------+\n          |                                |                                 |\n          | ----- 1. Register Begin -----> |                                 |\n          | <---- 2. Return Challenge ---- |                                 |\n          |                                |                                 |\n [Prompt Biometric]                        |                                 |\n [Sign Challenge w/ Private Key]           |                                 |\n          |                                |                                 |\n          | ----- 3. Register Finish ----> |                                 |\n          |    (Credential & Public Key)   | ----- 4. Save Public Key -----> |\n          |                                | <---- 5. OK -------------------- |\n          | <---- 6. JWT Token Issued ---- |                                 |\n```\n\n*   **Nguy\u00ean l\u00fd M\u00e3 h\u00f3a Kh\u00f3a c\u00f4ng khai (Asymmetric Cryptography)**: Khi \u0111\u0103ng k\u00fd Passkey, thi\u1ebft b\u1ecb ng\u01b0\u1eddi d\u00f9ng (Authenticator) t\u1ef1 \u0111\u1ed9ng kh\u1edfi t\u1ea1o c\u1eb7p kh\u00f3a m\u00e3 h\u00f3a:\n    *   **Private Key (Kh\u00f3a b\u00ed m\u1eadt)**: \u0110\u01b0\u1ee3c l\u01b0u tr\u1eef c\u1ed1 \u0111\u1ecbnh b\u00ean trong chip ph\u1ea7n c\u1ee9ng an to\u00e0n (TPM / Secure Enclave) c\u1ee7a thi\u1ebft b\u1ecb, kh\u00f4ng bao gi\u1edd g\u1eedi ra m\u1ea1ng.\n    *   **Public Key (Kh\u00f3a c\u00f4ng khai)**: \u0110\u01b0\u1ee3c g\u1eedi v\u1ec1 Backend Auth \u0111\u1ec3 l\u01b0u tr\u1eef trong CSDL MongoDB.\n*   **C\u01a1 ch\u1ebf Th\u00e1ch \u0111\u1ed1 - Ph\u1ea3n h\u1ed3i (Challenge-Response Mechanism)**: Khi \u0111\u0103ng nh\u1eadp, m\u00e1y ch\u1ee7 sinh ra m\u1ed9t chu\u1ed7i ng\u1eabu nhi\u00ean $Challenge$. Tr\u00ecnh duy\u1ec7t y\u00eau c\u1ea7u x\u00e1c nh\u1eadn sinh tr\u1eafc h\u1ecdc \u0111\u1ec3 gi\u1ea3i ph\u00f3ng Kh\u00f3a b\u00ed m\u1eadt k\u00fd s\u1ed1 l\u00ean $Challenge$. M\u00e1y ch\u1ee7 d\u00f9ng Kh\u00f3a c\u00f4ng khai \u0111\u1ec3 x\u00e1c minh ch\u1eef k\u00fd. C\u01a1 ch\u1ebf n\u00e0y ch\u1ed1ng l\u1ea1i 100% c\u00e1c cu\u1ed9c t\u1ea5n c\u00f4ng phishing trang gi\u1ea3 m\u1ea1o, v\u00ec ch\u1eef k\u00fd \u0111\u01b0\u1ee3c g\u1eafn li\u1ec1n v\u1edbi \u0111\u1ecbnh danh t\u00ean mi\u1ec1n (Relying Party ID - RP ID).\n\n#### 1.2.2. C\u01a1 ch\u1ebf M\u00e3 h\u00f3a phi\u00ean l\u00e0m vi\u1ec7c v\u1edbi JWT Ch\u1eef k\u00fd b\u1ea5t \u0111\u1ed1i \u1ee9ng RSA (RS256)\nSau khi \u0111\u0103ng nh\u1eadp th\u00e0nh c\u00f4ng, h\u1ec7 th\u1ed1ng c\u1ea5p ph\u00e1t m\u1ed9t **JSON Web Token (JWT)** \u0111\u1ec3 duy tr\u00ec phi\u00ean l\u00e0m vi\u1ec7c.\n*   Thay v\u00ec d\u00f9ng ch\u1eef k\u00fd \u0111\u1ed1i x\u1ee9ng HMAC (HS256) chia s\u1ebb chung b\u00ed m\u1eadt, KiGuard \u1ee9ng d\u1ee5ng thu\u1eadt to\u00e1n **RS256 (RSA Signature with SHA-256)**:\n    *   **Backend Auth** n\u1eafm gi\u1eef *Private Key RSA* \u0111\u1ec3 k\u00fd s\u1ed1 c\u1ea5p ph\u00e1t JWT Token.\n    *   **Backend Check** v\u00e0 c\u00e1c Microservices kh\u00e1c ch\u1ec9 c\u1ea7n l\u01b0u gi\u1eef *Public Key RSA* \u0111\u1ec3 x\u00e1c minh t\u00ednh h\u1ee3p l\u1ec7 c\u1ee7a Token m\u00e0 kh\u00f4ng lo r\u1ee7i ro b\u1ecb l\u1ed9 Private Key k\u00fd Token.\n\n---\n\n### 1.3. C\u1ea5u tr\u00fac D\u1eef li\u1ec7u X\u00e1c su\u1ea5t Cuckoo Filter v\u00e0 Thu\u1eadt to\u00e1n T\u1ed1i \u01b0u Backend Go\n\n#### 1.3.1. C\u1ea5u tr\u00fac d\u1eef li\u1ec7u Cuckoo Filter tr\u00ean b\u1ed9 nh\u1edb \u0111\u1ec7m RAM\n\u0110\u1ec3 \u0111\u00e1p \u1ee9ng t\u1ed1c \u0111\u1ed9 ki\u1ec3m tra URL d\u01b0\u1edbi **50ms** cho h\u00e0ng tri\u1ec7u request \u0111\u1ed3ng th\u1eddi, vi\u1ec7c truy v\u1ea5n CSDL \u0111\u0129a nh\u01b0 MongoDB cho m\u1ed7i l\u1ea7n chuy\u1ec3n trang l\u00e0 kh\u00f4ng th\u1ec3. KiGuard t\u00edch h\u1ee3p c\u1ea5u tr\u00fac d\u1eef li\u1ec7u x\u00e1c su\u1ea5t **Cuckoo Filter** ho\u1ea1t \u0111\u1ed9ng tr\u1ef1c ti\u1ebfp tr\u00ean RAM.\n\n```\n       URL String: \"http://scam-example.com\"\n                         |\n           +-------------+-------------+\n           |                           |\n     Hash Function 1             Hash Function 2\n           v                           v\n     Fingerprint f               Fingerprint f\n           v                           v\n   +---------------+           +---------------+\n   | Bucket i1     |           | Bucket i2     |\n   | [f1][f2][f3]  |           | [  ][  ][  ]  |\n   +---------------+           +---------------+\n```\n\n*   **Nguy\u00ean l\u00fd Cuckoo Hashing**: S\u1eed d\u1ee5ng 2 h\u00e0m b\u0103m \u0111\u1ed9c l\u1eadp \u0111\u1ec3 t\u00ednh to\u00e1n 2 v\u1ecb tr\u00ed x\u00f4 b\u0103m $i_1$ v\u00e0 $i_2$:\n    $$i_1 = \\text{hash}(x)$$\n    $$i_2 = i_1 \\oplus \\text{hash}(\\text{fingerprint}(x))$$\n*   **\u01afu \u0111i\u1ec3m v\u01b0\u1ee3t tr\u1ed9i so v\u1edbi Bloom Filter**:\n    *   H\u1ed7 tr\u1ee3 **X\u00f3a ph\u1ea7n t\u1eed (Deletion)** m\u00e0 kh\u00f4ng c\u1ea7n kh\u1edfi t\u1ea1o l\u1ea1i to\u00e0n b\u1ed9 b\u1ed9 l\u1ecdc.\n    *   Hi\u1ec7u su\u1ea5t s\u1eed d\u1ee5ng b\u1ed9 nh\u1edb \u0111\u1ea1t tr\u00ean **95% space efficiency** cho c\u00e1c t\u1eadp d\u1eef li\u1ec7u c\u1ef1c l\u1edbn.\n    *   \u0110\u1ed9 tr\u1ec5 truy xu\u1ea5t \u0111\u1ed9 ph\u1ee9c t\u1ea1p th\u1eddi gian $\\mathcal{O}(1)$, t\u1ed1c \u0111\u1ed9 ph\u1ea3n h\u1ed3i micro-gi\u00e2y.\n\n#### 1.3.2. Thu\u1eadt to\u00e1n ch\u1ed1ng ngh\u1ebdn CSDL Singleflight Group\nKhi m\u1ed9t URL ho\u00e0n to\u00e0n m\u1edbi (ch\u01b0a c\u00f3 trong Cuckoo Filter) \u0111\u01b0\u1ee3c h\u00e0ng ng\u00e0n ng\u01b0\u1eddi d\u00f9ng truy c\u1eadp c\u00f9ng m\u1ed9t l\u00fac, n\u1ebfu kh\u00f4ng c\u00f3 c\u01a1 ch\u1ebf \u0111i\u1ec1u ph\u1ed1i, h\u1ec7 th\u1ed1ng s\u1ebd b\u1ecb r\u01a1i v\u00e0o s\u1ef1 c\u1ed1 ngh\u1ebdn **Cache Stampede (Thundering Herd Problem)** do h\u00e0ng ng\u00e0n request \u0111\u1ed3ng th\u1eddi \u0111\u1ea9y xu\u1ed1ng AI Phishing Service v\u00e0 MongoDB.\n\n*   KiGuard t\u00edch h\u1ee3p th\u01b0 vi\u1ec7n **`singleflight.Group`** c\u1ee7a Golang: Khi request \u0111\u1ea7u ti\u00ean cho URL $X$ \u0111ang \u0111\u01b0\u1ee3c x\u1eed l\u00fd, t\u1ea5t c\u1ea3 c\u00e1c request tr\u00f9ng l\u1eb7p $X$ ti\u1ebfp theo s\u1ebd r\u01a1i v\u00e0o tr\u1ea1ng th\u00e1i ch\u1edd (Wait). Khi request \u0111\u1ea7u ti\u00ean ho\u00e0n t\u1ea5t v\u00e0 tr\u1ea3 v\u1ec1 k\u1ebft qu\u1ea3, `singleflight` t\u1ef1 \u0111\u1ed9ng chia s\u1ebb (Share) k\u1ebft qu\u1ea3 \u0111\u00f3 cho to\u00e0n b\u1ed9 c\u00e1c request \u0111ang ch\u1edd m\u00e0 ch\u1ec9 c\u1ea7n g\u1ecdi AI/CSDL \u0111\u00fang **1 l\u1ea7n duy nh\u1ea5t**.\n\n#### 1.3.3. H\u00e0ng \u0111\u1ee3i \u0111\u1ec7m Go Channel b\u1ea5t \u0111\u1ed3ng b\u1ed9 (Asynchronous Batch Logging Worker)\nGhi log l\u1ecbch s\u1eed qu\u00e9t (`CheckLog`) l\u00e0 t\u00e1c v\u1ee5 t\u1ed1n t\u00e0i nguy\u00ean I/O \u0111\u0129a. \n*   Backend Check kh\u1edfi t\u1ea1o m\u1ed9t **Go Channel \u0111\u1ec7m** c\u00f3 dung l\u01b0\u1ee3ng l\u00ean t\u1edbi **10,000 slots**. M\u1ecdi request qu\u00e9t sau khi tr\u1ea3 k\u1ebft qu\u1ea3 cho Client s\u1ebd \u0111\u1ea9y log v\u00e0o Channel n\u00e0y trong $0\\text{ms}$ m\u00e0 kh\u00f4ng c\u1ea7n ch\u1edd ghi v\u00e0o CSDL.\n*   M\u1ed9t ti\u1ebfn tr\u00ecnh ch\u1ea1y ng\u1ea7m (**Batch Worker**) \u0111\u1ecbnh k\u1ef3 th\u1ef1c hi\u1ec7n gom \u0111\u1ee3t (**Bulk Write**) 100 b\u1ea3n ghi/l\u1ea7n ho\u1eb7c tr\u00f2n 1 gi\u00e2y/l\u1ea7n \u0111\u1ec3 ghi h\u00e0ng lo\u1ea1t v\u00e0o MongoDB, gi\u00fap gi\u1ea3m s\u1ed1 l\u01b0\u1ee3ng giao d\u1ecbch I/O CSDL l\u00ean t\u1edbi 99%.\n\n---\n\n### 1.4. Tr\u00ed tu\u1ec7 Nh\u00e2n t\u1ea1o Gemini LLM v\u00e0 K\u1ef9 thu\u1eadt RAG (Retrieval-Augmented Generation)\n\n#### 1.4.1. Ph\u00e2n t\u00edch \u0111\u1ed9ng b\u1eb1ng ch\u1ee9ng l\u1eeba \u0111\u1ea3o v\u1edbi Gemini LLM (AI Phishing Detector)\nKhi ph\u00e1t hi\u1ec7n URL nghi ng\u1edd m\u1edbi, ph\u00e2n h\u1ec7 AI Python (FastAPI) t\u1ef1 \u0111\u1ed9ng thu th\u1eadp c\u00e1c b\u1eb1ng ch\u1ee9ng th\u00f4 bao g\u1ed3m:\n*   M\u00e3 ngu\u1ed3n HTML DOM (c\u1ea5u tr\u00fac form \u0111\u0103ng nh\u1eadp, \u0111\u01b0\u1eddng d\u1eabn script).\n*   Th\u00f4ng tin t\u00ean mi\u1ec1n WHOIS (ng\u00e0y \u0111\u0103ng k\u00fd, nh\u00e0 c\u1ea5p ph\u00e1t, tu\u1ed5i \u0111\u1eddi t\u00ean mi\u1ec1n).\n*   B\u1ea3n ghi DNS (IP m\u00e1y ch\u1ee7, b\u1ea3n ghi MX/TXT).\n\nD\u1eef li\u1ec7u th\u00f4 n\u00e0y \u0111\u01b0\u1ee3c c\u1ea5u tr\u00fac th\u00e0nh ng\u1eef c\u1ea3nh \u0111\u1ec3 g\u1eedi t\u1edbi m\u00f4 h\u00ecnh **Gemini LLM (Google AI)** ph\u00e2n t\u00edch b\u1eb1ng k\u1ef9 thu\u1eadt Few-shot Prompting, tr\u1ea3 v\u1ec1 \u0111i\u1ec3m s\u1ed1 r\u1ee7i ro (Risk Score: 0 - 100%) v\u00e0 danh s\u00e1ch c\u00e1c d\u1ea5u hi\u1ec7u vi ph\u1ea1m chi ti\u1ebft.\n\n#### 1.4.2. Tr\u1ee3 l\u00fd Lu\u1eadt An ninh m\u1ea1ng v\u1edbi K\u1ef9 thu\u1eadt Truy h\u1ed3i RAG (Retrieval-Augmented Generation)\n\u0110\u1ec3 ng\u0103n ch\u1eb7n hi\u1ec7n t\u01b0\u1ee3ng m\u00f4 h\u00ecnh AI b\u1ecba \u0111\u1eb7t th\u00f4ng tin (Hallucination) khi t\u01b0 v\u1ea5n ph\u00e1p lu\u1eadt, KiGuard tri\u1ec3n khai ki\u1ebfn tr\u00fac **RAG (Retrieval-Augmented Generation)**:\n\n```\n+---------------------+      +---------------------+      +---------------------+\n| User Legal Question | ---> | Vector Embedding    | ---> | Similarity Search   |\n| \"M\u1ee9c ph\u1ea1t l\u1eeba \u0111\u1ea3o?\" |      | (text-embedding-3)  |      | in FAISS Vector DB  |\n+---------------------+      +---------------------+      +---------------------+\n                                                                     |\n                                                                Matched Law\n                                                                  Chunks\n                                                                     v\n+---------------------+      +---------------------+      +---------------------+\n| User Receives Exact | <--- | LLM (Gemini API)    | <--- | Augment Prompt with |\n| Cited Law Answer    |      | Generates Answer    |      | Legal Context       |\n+---------------------+      +---------------------+      +---------------------+\n```\n\n1.  **Ph\u00e2n m\u1ea3nh D\u1eef li\u1ec7u (Chunking)**: To\u00e0n b\u1ed9 v\u0103n b\u1ea3n Lu\u1eadt An ninh m\u1ea1ng 2018, Ngh\u1ecb \u0111\u1ecbnh 53/2022/N\u0110-CP, Ngh\u1ecb \u0111\u1ecbnh 179/2025/N\u0110-CP \u0111\u01b0\u1ee3c l\u00e0m s\u1ea1ch v\u00e0 ph\u00e2n m\u1ea3nh th\u00e0nh c\u00e1c \u0111o\u1ea1n v\u0103n nh\u1ecf c\u00f3 \u0111\u1ed9 d\u00e0i t\u1ed1i \u01b0u (500 tokens).\n2.  **Nh\u00fang Vector (Embeddings)**: Chuy\u1ec3n \u0111\u1ed5i c\u00e1c \u0111o\u1ea1n v\u0103n b\u1ea3n th\u00e0nh c\u00e1c vector kh\u00f4ng gian \u0111a chi\u1ec1u nh\u1edd m\u00f4 h\u00ecnh nh\u00fang v\u0103n b\u1ea3n.\n3.  **L\u01b0u tr\u1eef Vector DB (FAISS / Pinecone)**: L\u01b0u tr\u1eef t\u1eadp h\u1ee3p vector tri th\u1ee9c lu\u1eadt v\u00e0o c\u01a1 s\u1edf d\u1eef li\u1ec7u vector.\n4.  **Truy v\u1ea5n t\u01b0\u01a1ng \u0111\u1ed3ng (Cosine Similarity Search)**: Khi ng\u01b0\u1eddi d\u00f9ng \u0111\u1eb7t c\u00e2u h\u1ecfi, h\u1ec7 th\u1ed1ng chuy\u1ec3n c\u00e2u h\u1ecfi th\u00e0nh vector v\u00e0 t\u00ednh kho\u1ea3ng c\u00e1ch Cosine \u0111\u1ec3 tr\u00edch xu\u1ea5t ra $K$ \u0111o\u1ea1n v\u0103n b\u1ea3n lu\u1eadt c\u00f3 \u0111\u1ed9 t\u01b0\u01a1ng \u0111\u1ed3ng ng\u1eef c\u1ea3nh cao nh\u1ea5t.\n5.  **T\u1ed5ng h\u1ee3p Prompt & Sinh c\u00e2u tr\u1ea3 l\u1eddi**: Gh\u00e9p c\u00e1c \u0111o\u1ea1n lu\u1eadt tr\u00edch xu\u1ea5t \u0111\u01b0\u1ee3c l\u00e0m ng\u1eef c\u1ea3nh (Context) b\u1eaft bu\u1ed9c cho Gemini LLM \u0111\u1ec3 sinh ra c\u00e2u tr\u1ea3 l\u1eddi ch\u00ednh x\u00e1c v\u00e0 tr\u00edch d\u1eabn r\u00f5 \u0110i\u1ec1u, Kho\u1ea3n lu\u1eadt t\u01b0\u01a1ng \u1ee9ng.\n\n---\n\n### 1.5. Ki\u1ebfn tr\u00fac Ti\u1ec7n \u00edch Tr\u00ecnh duy\u1ec7t Manifest V3 v\u00e0 Can thi\u1ec7p DOM/WebSocket t\u1ea1i Bi\u00ean\n\n#### 1.5.1. Chu\u1ea9n Ki\u1ebfn tr\u00fac Chrome Extension Manifest V3\nTi\u1ec7n \u00edch m\u1edf r\u1ed9ng KiGuard \u0111\u01b0\u1ee3c x\u00e2y d\u1ef1ng theo ti\u00eau chu\u1ea9n **Manifest V3** m\u1edbi nh\u1ea5t c\u1ee7a Google Chromium:\n*   **Service Worker (Background)**: Thay th\u1ebf cho Background Page ch\u1ea1y li\u00ean t\u1ee5c, Service Worker ch\u1ea1y b\u1ea5t \u0111\u1ed3ng b\u1ed9 theo s\u1ef1 ki\u1ec7n (Event-driven), gi\u00fap ti\u1ebft ki\u1ec7m t\u1ed1i \u0111a t\u00e0i nguy\u00ean b\u1ed9 nh\u1edb RAM c\u1ee7a m\u00e1y t\u00ednh.\n*   **Declarative Net Request API**: Cho ph\u00e9p ti\u1ec7n \u00edch ch\u1eb7n c\u00e1c request m\u1ea1ng \u0111\u1ed9c h\u1ea1i ngay t\u1ea1i t\u1ea7ng l\u00f5i tr\u00ecnh duy\u1ec7t tr\u01b0\u1edbc khi request \u0111\u00f3 \u0111\u01b0\u1ee3c kh\u1edfi t\u1ea1o.\n\n#### 1.5.2. K\u1ef9 thu\u1eadt Gi\u00e1m s\u00e1t c\u00e2y DOM v\u00e0 B\u1ea3o v\u1ec7 Quy\u1ec1n ri\u00eang t\u01b0 (DataBlurShield)\n*   **MutationObserver API**: Content Script \u0111\u0103ng k\u00fd MutationObserver \u0111\u1ec3 theo d\u00f5i m\u1ecdi bi\u1ebfn \u0111\u1ed9ng thay \u0111\u1ed5i c\u1ee7a c\u00e2y ph\u1ea7n t\u1eed DOM trang web th\u1eddi gian th\u1ef1c.\n*   **Regex Engine & Area Blur**: Khi ph\u00e1t hi\u1ec7n chu\u1ed7i k\u00fd t\u1ef1 kh\u1edbp v\u1edbi \u0111\u1ecbnh d\u1ea1ng PII (Email, S\u1ed1 \u0111i\u1ec7n tho\u1ea1i, S\u1ed1 th\u1ebb ng\u00e2n h\u00e0ng, M\u1eadt kh\u1ea9u), h\u1ec7 th\u1ed1ng t\u1ef1 \u0111\u1ed9ng b\u1ecdc chu\u1ed7i \u0111\u00f3 v\u00e0o th\u1ebb `<span class=\"kiguard-blurred\">` v\u1edbi thu\u1ed9c t\u00ednh l\u00e0m m\u1edd CSS. H\u1ed7 tr\u1ee3 ph\u00edm t\u1eaft v\u00e0 k\u1ef9 thu\u1eadt t\u00ednh to\u00e1n t\u1ecda \u0111\u1ed9 \u0111\u1ec3 k\u00e9o th\u1ea3 v\u00f9ng ch\u1ecdn (Drag-to-blur) tr\u00ean \u1ea3nh.\n*   **TranslateShield**: T\u1ef1 \u0111\u1ed9ng ch\u00e8n thu\u1ed9c t\u00ednh `translate=\"no\"` v\u00e0o c\u00e1c \u00f4 nh\u1eadp li\u1ec7u nh\u1ea1y c\u1ea3m (`<input type=\"password\">`, `<input type=\"credit-card\">`) \u0111\u1ec3 ch\u1eb7n \u0111\u1ee9ng c\u00e1c c\u00f4ng c\u1ee5 d\u1ecbch t\u1ef1 \u0111\u1ed9ng c\u00e0o g\u1eedi d\u1eef li\u1ec7u v\u1ec1 m\u00e1y ch\u1ee7 d\u1ecbch thu\u1eadt.\n\n#### 1.5.3. Can thi\u1ec7p lu\u1ed3ng m\u1ea1ng WebSocket (FbWsHook & FbTimer)\n*   **WebSocket Interception (`FbWsHook`)**: Ghi \u0111\u00e8 (Override) \u0111\u1ed1i t\u01b0\u1ee3ng `window.WebSocket` nguy\u00ean b\u1ea3n c\u1ee7a tr\u00ecnh duy\u1ec7t \u0111\u1ec3 soi chi\u1ebfu c\u00e1c g\u00f3i tin JSON/Binary \u0111i qua m\u1ea1ng x\u00e3 h\u1ed9i Facebook, l\u1ecdc b\u1ecf c\u00e1c g\u00f3i tin ch\u1ee9a qu\u1ea3ng c\u00e1o l\u1eeba \u0111\u1ea3o, b\u00e0i vi\u1ebft t\u00e0i tr\u1ee3 (Sponsored) tr\u01b0\u1edbc khi ch\u00fang \u0111\u01b0\u1ee3c render l\u00ean m\u00e0n h\u00ecnh.\n*   **FbTimer**: \u0110\u1ebfm ng\u01b0\u1ee3c th\u1eddi gian s\u1eed d\u1ee5ng m\u1ea1ng x\u00e3 h\u1ed9i v\u00e0 t\u1ef1 \u0111\u1ed9ng k\u00edch ho\u1ea1t Overlay ch\u1eb7n t\u01b0\u01a1ng t\u00e1c khi ng\u01b0\u1eddi d\u00f9ng v\u01b0\u1ee3t qu\u00e1 h\u1ea1n m\u1ee9c th\u1eddi gian \u0111\u00e3 thi\u1ebft l\u1eadp.\n\n---\n\n### 1.6. C\u01a1 s\u1edf D\u1eef li\u1ec7u NoSQL MongoDB v\u00e0 Chi\u1ebfn l\u01b0\u1ee3c T\u1ed1i \u01b0u C\u1ea5u tr\u00fac\n\nH\u1ec7 th\u1ed1ng ch\u1ecdn **MongoDB** l\u00e0m c\u01a1 s\u1edf d\u1eef li\u1ec7u ch\u00ednh nh\u1edd kh\u1ea3 n\u0103ng m\u1edf r\u1ed9ng linh ho\u1ea1t Schema (Schema-less) v\u00e0 hi\u1ec7u n\u0103ng \u0111\u1ecdc ghi cao.\n\n#### 1.6.1. So s\u00e1nh Chi\u1ebfn l\u01b0\u1ee3c Nh\u00fang (Embedding) vs Tham chi\u1ebfu (Referencing)\n*   **Chi\u1ebfn l\u01b0\u1ee3c Nh\u00fang (Embedded Documents)**: \u00c1p d\u1ee5ng cho th\u00f4ng tin Passkeys (`Credential`) n\u1eb1m tr\u1ef1c ti\u1ebfp b\u00ean trong Collection `USER`. V\u00ec s\u1ed1 l\u01b0\u1ee3ng Passkey c\u1ee7a m\u1ed9t ng\u01b0\u1eddi d\u00f9ng th\u01b0\u1eddng \u00edt ($<10$ thi\u1ebft b\u1ecb), vi\u1ec7c nh\u00fang gi\u00fap \u0111\u1ecdc to\u00e0n b\u1ed9 h\u1ed3 s\u01a1 v\u00e0 kh\u00f3a c\u00f4ng khai x\u00e1c th\u1ef1c ch\u1ec9 trong **1 l\u1ea7n truy v\u1ea5n duy nh\u1ea5t** (Zero Join Overhead).\n*   **Chi\u1ebfn l\u01b0\u1ee3c Tham chi\u1ebfu (Referenced Documents)**: \u00c1p d\u1ee5ng cho quan h\u1ec7 gi\u1eefa `REPORT` (\u0110\u01a1n b\u00e1o c\u00e1o) v\u00e0 `USER`. V\u00ec m\u1ed9t ng\u01b0\u1eddi d\u00f9ng c\u00f3 th\u1ec3 g\u1eedi h\u00e0ng ng\u00e0n \u0111\u01a1n b\u00e1o c\u00e1o, vi\u1ec7c tham chi\u1ebfu qua `ObjectID` gi\u00fap tr\u00e1nh gi\u1edbi h\u1ea1n k\u00edch th\u01b0\u1edbc t\u00e0i li\u1ec7u $16\\text{MB}$ c\u1ee7a MongoDB v\u00e0 cho ph\u00e9p tra c\u1ee9u linh ho\u1ea1t.\n\n#### 1.6.2. T\u1ed1i \u01b0u h\u00f3a Ch\u1ec9 m\u1ee5c (B-Tree Indexing)\nT\u1ea5t c\u1ea3 c\u00e1c tr\u01b0\u1eddng d\u1eef li\u1ec7u t\u1ea7n su\u1ea5t tra c\u1ee9u cao nh\u01b0 `URL`, `Domain`, `Email`, `Username`, `ReporterID` \u0111\u1ec1u \u0111\u01b0\u1ee3c t\u1ea1o ch\u1ec9 m\u1ee5c \u0111\u01a1n ho\u1eb7c ch\u1ec9 m\u1ee5c ph\u1ee9c h\u1ee3p (Compound Index) d\u1ea1ng B-Tree, \u0111\u1ea3m b\u1ea3o t\u1ed1c \u0111\u1ed9 truy v\u1ea5n CSDL \u0111\u1ea1t d\u01b0\u1edbi **5ms**.\n\n---\n\n## CH\u01af\u01a0NG II: PH\u00c2N T\u00cdCH Y\u00caU C\u1ea6U H\u1ec6 TH\u1ed0NG\n\n### 2.1. Ph\u00e2n r\u00e3 T\u00e1c nh\u00e2n v\u00e0 Ph\u00e2n t\u00edch Vai tr\u00f2 (Actor Decomposition & Hierarchy)\n\nM\u1ecdi h\u1ec7 th\u1ed1ng ph\u1ea7n m\u1ec1m hi\u1ec7u qu\u1ea3 \u0111\u1ec1u b\u1eaft \u0111\u1ea7u t\u1eeb vi\u1ec7c x\u00e1c \u0111\u1ecbnh ch\u00ednh x\u00e1c c\u00e1c \u0111\u1ed1i t\u01b0\u1ee3ng t\u01b0\u01a1ng t\u00e1c. H\u1ec7 th\u1ed1ng KiGuard Ecosystem \u0111\u01b0\u1ee3c ph\u00e2n r\u00e3 th\u00e0nh **3 nh\u00f3m t\u00e1c nh\u00e2n ch\u00ednh**, k\u1ebft h\u1ee3p m\u00f4 h\u00ecnh k\u1ebf th\u1eeba t\u00e1c nh\u00e2n (**Actor Generalization**) \u0111\u1ec3 ph\u00e2n t\u00e1ch r\u00f5 quy\u1ec1n h\u1ea1n v\u00e0 h\u00e0nh vi x\u1eed l\u00fd:\n\n```mermaid\nflowchart TD\n    System[\"H\u1ec7 th\u1ed1ng KiGuard Ecosystem\"]\n    \n    Human[\"a. T\u00e1c nh\u00e2n con ng\u01b0\u1eddi (Human Actors)\"]\n    SysActor[\"b. T\u00e1c nh\u00e2n h\u1ec7 th\u1ed1ng (System Actors)\"]\n    Background[\"c. T\u00e1c nh\u00e2n ch\u1ea1y n\u1ec1n (Background Actors)\"]\n    \n    System --> Human\n    System --> SysActor\n    System --> Background\n    \n    Human --> Guest[\"Kh\u00e1ch v\u00e3ng lai (Guest)\"]\n    Guest --> RegUser[\"Ng\u01b0\u1eddi d\u00f9ng \u0111\u00e3 \u0111\u0103ng k\u00fd (Registered User)\"]\n    Human --> Mod[\"Ki\u1ec3m duy\u1ec7t vi\u00ean (Moderator)\"]\n    Human --> Admin[\"Qu\u1ea3n tr\u1ecb vi\u00ean t\u1ed1i cao (Super Admin)\"]\n\n    SysActor --> AI_Phish[\"AI Phishing Detector\"]\n    SysActor --> AI_RAG[\"AI Chatbot RAG\"]\n    \n    Background --> Crawler[\"H\u1ec7 Crawler t\u1ef1 \u0111\u1ed9ng\"]\n```\n\n#### Chi ti\u1ebft Ph\u00e2n r\u00e3 v\u00e0 Ph\u00e2n quy\u1ec1n T\u00e1c nh\u00e2n:\n\n##### a. T\u00e1c nh\u00e2n con ng\u01b0\u1eddi (Human Actors)\n*   **Kh\u00e1ch v\u00e3ng lai (Guest)**: Ng\u01b0\u1eddi d\u00f9ng ch\u01b0a \u0111\u0103ng k\u00fd t\u00e0i kho\u1ea3n. \n    *   C\u00f3 quy\u1ec1n qu\u00e9t ki\u1ec3m tra URL tr\u1ef1c ti\u1ebfp tr\u00ean trang ch\u1ee7 Web Portal ho\u1eb7c qua Telegram Bot \u0111\u1ec3 nh\u1eadn c\u1ea3nh b\u00e1o an to\u00e0n c\u01a1 b\u1ea3n.\n    *   S\u1eed d\u1ee5ng ti\u1ec7n \u00edch tr\u00ecnh duy\u1ec7t (Chrome Extension) \u0111\u1ec3 ph\u00e1t hi\u1ec7n th\u1eddi gian th\u1ef1c (Realtime Detect) c\u00e1c website \u0111\u1ed9c h\u1ea1i.\n    *   S\u1eed d\u1ee5ng Chatbot AI \u0111\u1ec3 t\u01b0 v\u1ea5n v\u1ec1 c\u00e1c h\u00ecnh th\u1ee9c l\u1eeba \u0111\u1ea3o ph\u1ed5 bi\u1ebfn v\u00e0 tra c\u1ee9u c\u00e1c quy \u0111\u1ecbnh c\u1ee7a Lu\u1eadt An ninh m\u1ea1ng.\n*   **Ng\u01b0\u1eddi d\u00f9ng \u0111\u00e3 \u0111\u0103ng k\u00fd (Registered User)**: K\u1ebf th\u1eeba to\u00e0n b\u1ed9 quy\u1ec1n h\u1ea1n c\u1ee7a *Kh\u00e1ch v\u00e3ng lai (Guest)*, \u0111\u1ed3ng th\u1eddi \u0111\u01b0\u1ee3c m\u1edf r\u1ed9ng c\u00e1c t\u00ednh n\u0103ng n\u00e2ng cao:\n    *   S\u1eed d\u1ee5ng ph\u01b0\u01a1ng th\u1ee9c x\u00e1c th\u1ef1c sinh tr\u1eafc h\u1ecdc kh\u00f4ng m\u1eadt kh\u1ea9u (**Passkey / WebAuthn**) \u0111\u1ec3 \u0111\u0103ng nh\u1eadp an to\u00e0n ch\u1ed1ng phishing t\u00e0i kho\u1ea3n.\n    *   G\u1eedi \u0111\u01a1n b\u00e1o c\u00e1o (Report) c\u00e1c li\u00ean k\u1ebft (URL), s\u1ed1 \u0111i\u1ec7n tho\u1ea1i ho\u1eb7c s\u1ed1 t\u00e0i kho\u1ea3n ng\u00e2n h\u00e0ng l\u1eeba \u0111\u1ea3o k\u00e8m \u1ea3nh ch\u1ee5p m\u00e0n h\u00ecnh l\u00e0m b\u1eb1ng ch\u1ee9ng.\n    *   Theo d\u00f5i chi ti\u1ebft tr\u1ea1ng th\u00e1i x\u1eed l\u00fd c\u00e1c \u0111\u01a1n b\u00e1o c\u00e1o c\u1ee7a ri\u00eang m\u00ecnh qua giao di\u1ec7n Dashboard c\u00e1 nh\u00e2n.\n    *   G\u1eedi khi\u1ebfu n\u1ea1i ph\u1ea3n h\u1ed3i \u0111\u1ed1i v\u1edbi c\u00e1c b\u00e1o c\u00e1o ho\u1eb7c t\u00ean mi\u1ec1n b\u1ecb ch\u1eb7n nh\u1ea7m (False Positive).\n*   **Ki\u1ec3m duy\u1ec7t vi\u00ean (Moderator)**: Nh\u00e2n vi\u00ean v\u1eadn h\u00e0nh h\u1ec7 th\u1ed1ng c\u00f3 nhi\u1ec7m v\u1ee5:\n    *   Ki\u1ec3m duy\u1ec7t, ph\u00ea duy\u1ec7t (`APPROVED`) ho\u1eb7c t\u1eeb ch\u1ed1i (`REJECTED`) c\u00e1c \u0111\u01a1n b\u00e1o c\u00e1o l\u1eeba \u0111\u1ea3o do ng\u01b0\u1eddi d\u00f9ng g\u1eedi l\u00ean d\u1ef1a tr\u00ean \u0111i\u1ec3m s\u1ed1 g\u1ee3i \u00fd t\u1eeb AI.\n    *   Qu\u1ea3n l\u00fd danh s\u00e1ch ch\u1eb7n (Blocklist) v\u00e0 danh s\u00e1ch tr\u1eafng (Allowlist) c\u1ee5c b\u1ed9.\n*   **Qu\u1ea3n tr\u1ecb vi\u00ean t\u1ed1i cao (Super Admin)**: Quy\u1ec1n h\u1ea1n cao nh\u1ea5t trong to\u00e0n b\u1ed9 h\u1ec7 th\u1ed1ng:\n    *   Qu\u1ea3n l\u00fd t\u00e0i kho\u1ea3n c\u1ee7a ng\u01b0\u1eddi d\u00f9ng cu\u1ed1i v\u00e0 c\u00e1c ki\u1ec3m duy\u1ec7t vi\u00ean (Moderators).\n    *   To\u00e0n quy\u1ec1n CRUD (Th\u00eam, s\u1eeda, x\u00f3a) danh s\u00e1ch \u0111en (Blacklist), danh s\u00e1ch tr\u1eafng (Allowlist), c\u01a1 s\u1edf d\u1eef li\u1ec7u Scammer Registry.\n    *   Gi\u00e1m s\u00e1t ho\u1ea1t \u0111\u1ed9ng c\u1ee7a Moderator, Registered User v\u00e0 Guest; xem B\u1ea3ng \u0111i\u1ec1u khi\u1ec3n (Dashboard) th\u1ed1ng k\u00ea hi\u1ec7u n\u0103ng to\u00e0n h\u1ec7 th\u1ed1ng.\n\n##### b. T\u00e1c nh\u00e2n h\u1ec7 th\u1ed1ng (System Actors)\n*   **AI Phishing Detector**: D\u1ecbch v\u1ee5 n\u1ec1n (FastAPI Port 8000) ti\u1ebfp nh\u1eadn c\u00e1c URL ch\u01b0a c\u00f3 d\u1eef li\u1ec7u t\u0129nh \u0111\u1ec3 t\u1ef1 \u0111\u1ed9ng thu th\u1eadp b\u1eb1ng ch\u1ee9ng (HTML DOM, WHOIS, DNS) v\u00e0 g\u1ecdi Gemini API ph\u00e2n t\u00edch nguy c\u01a1 l\u1eeba \u0111\u1ea3o th\u1eddi gian th\u1ef1c, t\u00edch h\u1ee3p tr\u00ean Extension v\u00e0 Telegram Bot.\n*   **AI Chatbot RAG**: D\u1ecbch v\u1ee5 chatbot AI (FastAPI Port 8003) ti\u1ebfp nh\u1eadn c\u00e2u h\u1ecfi c\u1ee7a ng\u01b0\u1eddi d\u00f9ng, th\u1ef1c hi\u1ec7n truy h\u1ed3i tri th\u1ee9c b\u1ea3o m\u1eadt t\u1eeb c\u01a1 s\u1edf d\u1eef li\u1ec7u vector FAISS v\u00e0 t\u1ea1o c\u00e2u tr\u1ea3 l\u1eddi ti\u1ebfng Vi\u1ec7t ch\u00ednh x\u00e1c k\u00e8m tr\u00edch d\u1eabn \u0110i\u1ec1u lu\u1eadt.\n\n##### c. T\u00e1c nh\u00e2n ch\u1ea1y n\u1ec1n (Background Actors)\n*   **H\u1ec7 Crawler t\u1ef1 \u0111\u1ed9ng**: T\u00e1c nh\u00e2n n\u1ec1n ch\u1ea1y \u0111\u1ecbnh k\u1ef3 c\u00e0o d\u1eef li\u1ec7u Allowlist/Denylist t\u1eeb c\u00e1c ngu\u1ed3n ch\u00ednh th\u1ed1ng (ChongLuaDao, C\u1ed5ng th\u00f4ng tin Ch\u00ednh ph\u1ee7) \u0111\u1ec3 \u0111\u1ed3ng b\u1ed9 v\u00e0o c\u01a1 s\u1edf d\u1eef li\u1ec7u MongoDB v\u00e0 n\u1ea1p \u0111\u00e8 RAM Cuckoo Filter.\n\n---\n\n### 2.2. Bi\u1ec3u \u0111\u1ed3 Ca S\u1eed D\u1ee5ng v\u00e0 \u0110\u1eb7c t\u1ea3 Chi ti\u1ebft Ph\u00e2n H\u1ec7 (Modular Use Cases & Specifications)\n\nM\u00f4 h\u00ecnh h\u00f3a Ca S\u1eed D\u1ee5ng (Use Case Modeling) d\u1ef1a tr\u00ean nguy\u00ean l\u00fd c\u1ed1t l\u00f5i: **B\u1ea3n ch\u1ea5t c\u1ee7a Use Case l\u00e0 s\u1ef1 t\u01b0\u01a1ng t\u00e1c 3 th\u00e0nh t\u1ed1: T\u00e1c nh\u00e2n l\u00e0 ai (WHO) -> T\u00e1c nh\u00e2n mu\u1ed1n l\u00e0m g\u00ec (ACTOR GOAL/ACTION) -> H\u1ec7 th\u1ed1ng ph\u1ea3n h\u1ed3i v\u00e0 h\u1ed7 tr\u1ee3 nh\u01b0 th\u1ebf n\u00e0o (SYSTEM SUPPORT)**.\n\nTo\u00e0n b\u1ed9 h\u1ec7 th\u1ed1ng \u0111\u01b0\u1ee3c \u0111\u00e1nh s\u1ed1 th\u1ee9 t\u1ef1 ca s\u1eed d\u1ee5ng chu\u1ea9n h\u00f3a tu\u1ea7n t\u1ef1 t\u1eeb **`UC1` \u0111\u1ebfn `UC12`** t\u01b0\u01a1ng \u1ee9ng v\u1edbi 3 nh\u00f3m ph\u00e2n h\u1ec7 ch\u1ee9c n\u0103ng.\n\n#### 2.2.1. T\u1ed5ng quan Danh m\u1ee5c v\u00e0 Ma tr\u1eadn T\u00e1c nh\u00e2n - H\u00e0nh \u0111\u1ed9ng - H\u1ec7 th\u1ed1ng H\u1ed7 tr\u1ee3\n\n| T\u00e1c nh\u00e2n (Actor - WHO) | H\u00e0nh \u0111\u1ed9ng / M\u1ee5c ti\u00eau c\u1ee7a T\u00e1c nh\u00e2n (Actor Action - WHAT ACTOR DOES) | S\u1ef1 H\u1ed7 tr\u1ee3 & Ph\u1ea3n h\u1ed3i c\u1ee7a H\u1ec7 th\u1ed1ng (System Support - WHAT SYSTEM PROVIDES) | M\u00e3 Ca S\u1eed D\u1ee5ng (Use Case ID) |\n| :--- | :--- | :--- | :---: |\n| **`Guest` / `ExtUser`** | Truy c\u1eadp trang web ho\u1eb7c l\u01b0\u1edbt web h\u00e0ng ng\u00e0y tr\u00ean tr\u00ecnh duy\u1ec7t. | H\u1ec7 th\u1ed1ng t\u1ef1 \u0111\u1ed9ng \u0111\u00e1nh ch\u1eb7n v\u00e0 qu\u00e9t URL ng\u1ea7m qua RAM Cuckoo Filter ($<50\\text{ms}$); Tr\u1ea3 v\u1ec1 tr\u1ea1ng th\u00e1i an to\u00e0n. | **`UC1`: Qu\u00e9t URL th\u1eddi gian th\u1ef1c** |\n| **`Guest` / `ExtUser`** | Mu\u1ed1n b\u1ea3o v\u1ec7 th\u00f4ng tin ri\u00eang t\u01b0 c\u00e1 nh\u00e2n kh\u00f4ng b\u1ecb l\u1ed9 tr\u00ean m\u00e0n h\u00ecnh. | Extension t\u1ef1 \u0111\u1ed9ng qu\u00e9t DOM v\u00e0 l\u00e0m m\u1edd c\u00e1c PII nh\u1ea1y c\u1ea3m (Email, S\u0110T, Th\u1ebb); H\u1ed7 tr\u1ee3 khoanh v\u00f9ng k\u00e9o th\u1ea3 (Drag-to-blur). | **`UC2`: L\u00e0m m\u1edd d\u1eef li\u1ec7u PII** |\n| **`Guest` / `ExtUser`** | Mu\u1ed1n \u1ea9n qu\u1ea3ng c\u00e1o r\u00e1c Facebook v\u00e0 ki\u1ec3m so\u00e1t h\u1ea1n m\u1ee9c l\u01b0\u1edbt web. | K\u00edch ho\u1ea1t `FbWsHook` ch\u1eb7n g\u00f3i tin qu\u1ea3ng c\u00e1o b\u1ea9n th\u1eddi gian th\u1ef1c v\u00e0 `FbTimer` \u0111\u1ebfm ng\u01b0\u1ee3c kh\u00f3a t\u01b0\u01a1ng t\u00e1c khi h\u1ebft h\u1ea1n m\u1ee9c. | **`UC3`: Ch\u1eb7n Tracker & Qu\u1ea3ng c\u00e1o** |\n| **`Guest` / `BotUser`** | Nh\u1eadp l\u1ec7nh `/check <url>` tr\u00ean Telegram \u0111\u1ec3 ki\u1ec3m tra link nhanh. | Bot Telegram t\u1ef1 \u0111\u1ed9ng g\u1ecdi Backend Check A h\u1ea1y ng\u1ea7m t\u1eeb Crawler:\n\n```mermaid\nflowchart LR\n    Mod[\"Ki\u1ec3m duy\u1ec7t vi\u00ean (Moderator)\"]\n    Admin[\"Qu\u1ea3n tr\u1ecb vi\u00ean t\u1ed1i cao (Super Admin)\"]\n    Crawler[\"Crawler t\u1ef1 \u0111\u1ed9ng\"]\n\n    subgraph AdminDashboard [\"PH\u00c2N H\u1ec6 QU\u1ea2N TR\u1eca V\u00c0 KI\u1ec2M DUY\u1ec6T\"]\n        UC11([\"UC11: Ki\u1ec3m duy\u1ec7t \u0111\u01a1n b\u00e1o c\u00e1o\"])\n        UC12([\"UC12: Qu\u1ea3n l\u00fd danh s\u00e1ch v\u00e0 Th\u1ed1ng k\u00ea\"])\n    end\n\n    Mod --> UC11\n    Admin --> UC11\n    Admin --> UC12\n    Crawler -.-> UC12\n```\n\n##### B\u1ea3ng \u0110\u1eb7c t\u1ea3 Ca S\u1eed D\u1ee5ng Ti\u00eau bi\u1ec3u (Ph\u00e2n h\u1ec7 Qu\u1ea3n tr\u1ecb):\n\n| M\u00e3 UC | T\u00ean Ca S\u1eed D\u1ee5ng | T\u00e1c nh\u00e2n ch\u00ednh | Ti\u1ec1n \u0111i\u1ec1u ki\u1ec7n | Lu\u1ed3ng x\u1eed l\u00fd ch\u00ednh (Main Success Scenario) | Ngo\u1ea1i l\u1ec7 / H\u1eadu \u0111i\u1ec1u ki\u1ec7n |\n| :---: | :--- | :--- | :--- | :--- | :--- |\n| **UC11**| Ki\u1ec3m duy\u1ec7t \u0111\u01a1n b\u00e1o c\u00e1o | `Mod`, `Admin` | T\u00e0i kho\u1ea3n Moderator | 1. Truy c\u1eadp danh s\u00e1ch b\u00e1o c\u00e1o `PENDING`.<br>2. Xem \u0111i\u1ec3m r\u1ee7i ro g\u1ee3i \u00fd t\u1eeb AI.<br>3. B\u1ea5m Ph\u00ea duy\u1ec7t (`APPROVED`) ho\u1eb7c T\u1eeb ch\u1ed1i (`REJECTED`). | N\u1ebfu ph\u00ea duy\u1ec7t, h\u1ec7 th\u1ed1ng t\u1ef1 \u0111\u1ed9ng l\u01b0u MongoDB v\u00e0 n\u1ea1p \u0111\u00e8 RAM Cuckoo Filter. |\n| **UC12**| Qu\u1ea3n l\u00fd danh s\u00e1ch & Th\u1ed1ng k\u00ea | `Admin`, `Crawler` | T\u00e0i kho\u1ea3n Super Admin | 1. CRUD to\u00e0n quy\u1ec1n Blacklist, Allowlist, Scammer.<br>2. Xem Dashboard bi\u1ec3u \u0111\u1ed3 l\u01b0u l\u01b0\u1ee3ng qu\u00e9t to\u00e0n h\u1ec7 th\u1ed1ng.<br>3. \u0110\u1ed3ng b\u1ed9 d\u1eef li\u1ec7u c\u00e0o t\u1eeb Crawler. | Cuckoo Filter tr\u00ean RAM t\u1ef1 \u0111\u1ed9ng l\u00e0m m\u1edbi t\u1ee9c th\u00ec. |\n\n---\n\n### 2.3. \u0110\u1eb7c t\u1ea3 Y\u00eau c\u1ea7u Ch\u1ee9c n\u0103ng Chi ti\u1ebft (Functional Requirements - FR)\n\nD\u1ef1a tr\u00ean k\u1ebft qu\u1ea3 ph\u00e2n t\u00edch s\u01a1 \u0111\u1ed3 Ca S\u1eed D\u1ee5ng v\u00e0 ki\u1ec3m tra to\u00e0n b\u1ed9 m\u00e3 ngu\u1ed3n h\u1ec7 th\u1ed1ng, c\u00e1c y\u00eau c\u1ea7u ch\u1ee9c n\u0103ng \u0111\u01b0\u1ee3c chi ti\u1ebft h\u00f3a theo t\u1eebng ph\u00e2n h\u1ec7 x\u1eed l\u00fd:\n\n#### 2.3.1. Ph\u00e2n h\u1ec7 Web Portal Dashboard (Frontend React + Backend Auth Go)\n1.  **X\u00e1c th\u1ef1c \u0111a ph\u01b0\u01a1ng th\u1ee9c (`FR-WEB-01`)**:\n    *   H\u1ed7 tr\u1ee3 \u0111\u0103ng k\u00fd/\u0111\u0103ng nh\u1eadp b\u1eb1ng Email/Password m\u00e3 h\u00f3a Bcrypt.\n    *   H\u1ed7 tr\u1ee3 \u0111\u0103ng nh\u1eadp M\u1ea1ng x\u00e3 h\u1ed9i qua Google OAuth2 (`/auth/callback/google`).\n    *   H\u1ed7 tr\u1ee3 \u0111\u0103ng k\u00fd/\u0111\u0103ng nh\u1eadp kh\u00f4ng m\u1eadt kh\u1ea9u **Passkey WebAuthn** (`/auth/passkey/register` & `/auth/passkey/login`).\n2.  **Qu\u1ea3n l\u00fd H\u1ed3 s\u01a1 c\u00e1 nh\u00e2n (`FR-WEB-02`)**: Truy xu\u1ea5t v\u00e0 c\u1eadp nh\u1eadt th\u00f4ng tin ng\u01b0\u1eddi d\u00f9ng (`GET /users/me`), cho ph\u00e9p x\u00f3a/th\u00eam thi\u1ebft b\u1ecb Passkey \u0111\u00e3 \u0111\u0103ng k\u00fd.\n3.  **G\u1eedi & Qu\u1ea3n l\u00fd \u0110\u01a1n b\u00e1o c\u00e1o (`FR-WEB-03`)**: G\u1eedi \u0111\u01a1n b\u00e1o c\u00e1o URL \u0111\u1ed9c h\u1ea1i k\u00e8m m\u00f4 t\u1ea3 v\u00e0 t\u00e0i li\u1ec7u b\u1eb1ng ch\u1ee9ng (`POST /reports`). Theo d\u00f5i ti\u1ebfn tr\u00ecnh ki\u1ec3m duy\u1ec7t v\u00e0 k\u1ebft qu\u1ea3 ch\u1ea5m \u0111i\u1ec3m r\u1ee7i ro c\u1ee7a AI th\u1eddi gian th\u1ef1c (`GET /reports/status`).\n4.  **Tra c\u1ee9u Scammer Registry (`FR-WEB-04`)**: Cho ph\u00e9p ng\u01b0\u1eddi d\u00f9ng t\u00ecm ki\u1ebfm th\u00f4ng tin c\u1ea3nh b\u00e1o c\u00e1c t\u00e0i kho\u1ea3n ng\u00e2n h\u00e0ng, s\u1ed1 \u0111i\u1ec7n tho\u1ea1i, t\u00ean mi\u1ec1n c\u00f3 d\u1ea5u hi\u1ec7u l\u1eeba \u0111\u1ea3o t\u00e0i ch\u00ednh (`GET /scammers`).\n5.  **Khi\u1ebfu n\u1ea1i g\u1ee1 ch\u1eb7n False Positive (`FR-WEB-05`)**: G\u1eedi \u0111\u01a1n khi\u1ebfu n\u1ea1i \u0111\u1ed1i v\u1edbi c\u00e1c website an to\u00e0n b\u1ecb ch\u1eb7n nh\u1ea7m, \u0111\u00ednh k\u00e8m gi\u1ea3i tr\u00ecnh \u0111\u1ec3 g\u1eedi l\u00ean Moderator.\n6.  **Tr\u1ee3 l\u00fd \u1ea3o RAG Chatbot (`FR-WEB-06`)**: K\u1ebft n\u1ed1i k\u00eanh WebSocket song c\u00f4ng (`/ws/chat`), h\u1ed7 tr\u1ee3 stream c\u00e2u tr\u1ea3 l\u1eddi h\u1ecfi \u0111\u00e1p v\u1ec1 Lu\u1eadt An ninh m\u1ea1ng 2018 v\u00e0 c\u00e1c Ngh\u1ecb \u0111\u1ecbnh li\u00ean quan.\n\n#### 2.3.2. Ph\u00e2n h\u1ec7 Chrome Extension & Telegram Bot (Client Shield)\n1.  **Qu\u00e9t URL th\u1eddi gian th\u1ef1c (`FR-EXT-01`)**: T\u1ef1 \u0111\u1ed9ng \u0111\u00e1nh ch\u1eb7n c\u00e1c URL tr\u01b0\u1edbc khi t\u1ea3i trang, g\u1ecdi API Backend Check (`POST /check`) \u0111\u1ec3 nh\u1eadn tr\u1ea1ng th\u00e1i c\u1ea3nh b\u00e1o an to\u00e0n.\n2.  **L\u00e0m m\u1edd th\u00f4ng tin PII (`FR-EXT-02`)**: K\u00edch ho\u1ea1t `MutationObserver` ph\u00e1t hi\u1ec7n v\u00e0 b\u1ecdc th\u1ebb CSS blur c\u00e1c chu\u1ed7i Email, S\u0110T, S\u1ed1 th\u1ebb t\u00edn d\u1ee5ng, Password. H\u1ed7 tr\u1ee3 ph\u00edm t\u1eaft v\u00e0 ch\u1ebf \u0111\u1ed9 khoanh v\u00f9ng k\u00e9o th\u1ea3 (Drag-to-blur).\n3.  **Ng\u0103n r\u00f2 r\u1ec9 d\u1ecbch thu\u1eadt (`FR-EXT-03`)**: T\u1ef1 \u0111\u1ed9ng inject thu\u1ed9c t\u00ednh `translate=\"no\"` v\u00e0o c\u00e1c form nh\u1eadp li\u1ec7u nh\u1ea1y c\u1ea3m.\n4.  **Ch\u1eb7n qu\u1ea3ng c\u00e1o b\u1ea9n & Qu\u1ea3n l\u00fd th\u1eddi gian Facebook (`FR-EXT-04`)**: Can thi\u1ec7p `window.WebSocket` (`FbWsHook`) \u1ea9n c\u00e1c g\u00f3i tin Sponsored/Scam Ads. \u0110\u1ebfm ng\u01b0\u1ee3c th\u1eddi gian l\u01b0\u1edbt web (`FbTimer`) v\u00e0 kh\u00f3a t\u01b0\u01a1ng t\u00e1c khi h\u1ebft gi\u1edd.\n5.  **Qu\u00e9t nhanh qua Telegram Bot (`FR-BOT-01`)**: Ti\u1ebfp nh\u1eadn l\u1ec7nh `/check <url>`, t\u1ef1 \u0111\u1ed9ng g\u1ecdi Backend Check v\u00e0 \u0111\u1ecbnh d\u1ea1ng tin nh\u1eafn ph\u1ea3n h\u1ed3i chi ti\u1ebft.\n\n#### 2.3.3. Ph\u00e2n h\u1ec7 Qu\u1ea3n tr\u1ecb Admin & Moderator (Go Gateway + MongoDB)\n1.  **Duy\u1ec7t \u0111\u01a1n b\u00e1o c\u00e1o (`FR-ADM-01`)**: Moderator xem danh s\u00e1ch \u0111\u01a1n b\u00e1o c\u00e1o (`GET /admin/reports`), duy\u1ec7t (`APPROVED`) ho\u1eb7c t\u1eeb ch\u1ed1i (`REJECTED`) d\u1ef1a tr\u00ean \u0111i\u1ec3m s\u1ed1 g\u1ee3i \u00fd t\u1eeb AI.\n2.  **Qu\u1ea3n l\u00fd Danh s\u00e1ch \u0111en/tr\u1eafng (`FR-ADM-02`)**: Admin c\u00f3 quy\u1ec1n th\u00eam/x\u00f3a URL \u0111\u1ed9c h\u1ea1i (`POST/DELETE /admin/urls`) v\u00e0 URL an to\u00e0n (`POST/DELETE /admin/allowlist`), t\u1ef1 \u0111\u1ed9ng k\u00edch ho\u1ea1t \u0111\u1ed3ng b\u1ed9 Cuckoo Filter tr\u00ean RAM.\n3.  **Qu\u1ea3n l\u00fd H\u1ed3 s\u01a1 Scammer (`FR-ADM-03`)**: Th\u00eam m\u1edbi, ch\u1ec9nh s\u1eeda, x\u00f3a c\u00e1c b\u1ea3n ghi t\u00e0i kho\u1ea3n l\u1eeba \u0111\u1ea3o (`POST/DELETE /admin/scammers`).\n4.  **B\u1ea3ng \u0111i\u1ec1u khi\u1ec3n Th\u1ed1ng k\u00ea (`FR-ADM-04`)**: Hi\u1ec3n th\u1ecb t\u1ed5ng quan c\u00e1c s\u1ed1 li\u1ec7u v\u1ec1 l\u01b0u l\u01b0\u1ee3ng qu\u00e9t, t\u1ef7 l\u1ec7 l\u1eeba \u0111\u1ea3o b\u1ecb ch\u1eb7n, danh s\u00e1ch IP r\u1ee7i ro (`GET /admin/dashboard-stats`).\n\n#### 2.3.4. Ph\u00e2n h\u1ec7 AI & Crawler t\u1ef1 \u0111\u1ed9ng (FastAPI + Python Scripts)\n1.  **C\u00e0o b\u1eb1ng ch\u1ee9ng & Ch\u1ea5m \u0111i\u1ec3m r\u1ee7i ro (`FR-AI-01`)**: AI Phishing Service c\u00e0o WHOIS, DNS, HTML DOM v\u00e0 g\u1ecdi Gemini LLM ch\u1ea5m \u0111i\u1ec3m r\u1ee7i ro t\u1eeb 0 - 100%.\n2.  **RAG Vector Search (`FR-AI-02`)**: AI ANM Service th\u1ef1c hi\u1ec7n ph\u00e2n m\u1ea3nh, nh\u00fang vector v\u00e0 t\u00ecm ki\u1ebfm t\u01b0\u01a1ng \u0111\u1ed3ng Cosine Similarity tr\u00ean FAISS Vector DB.\n3.  **Crawler & Sync Cuckoo RAM (`FR-CRAWLER-01`)**: \u0110\u1ecbnh k\u1ef3 c\u00e0o danh s\u00e1ch \u0111en t\u1eeb c\u00e1c ngu\u1ed3n ch\u00ednh th\u1ed1ng, ghi CSDL MongoDB v\u00e0 g\u1ecdi API n\u1ea1p \u0111\u00e8 RAM Cuckoo Filter.\n\n---\n\n### 2.4. \u0110\u1eb7c t\u1ea3 Y\u00eau c\u1ea7u Phi ch\u1ee9c n\u0103ng (Non-Functional Requirements - NFR)\n\n1.  **Hi\u1ec7u n\u0103ng & \u0110\u1ed9 tr\u1ec5 (Performance & Latency)**:\n    *   Th\u1eddi gian ph\u1ea3n h\u1ed3i lu\u1ed3ng qu\u00e9t t\u0129nh Fast Check qua Cuckoo RAM b\u1eaft bu\u1ed9c $<50\\text{ms}$.\n    *   Kh\u1ea3 n\u0103ng ch\u1ecbu t\u1ea3i \u0111\u1ed3ng th\u1eddi c\u1ee7a Backend Check $\\ge 1000\\text{ req/s}$.\n    *   T\u1ed1c \u0111\u1ed9 qu\u00e9t MutationObserver v\u00e0Regex l\u00e0m m\u1edd PII t\u1ea1i Extension $<10\\text{ms}$.\n    *   Th\u1eddi gian ph\u00e2n t\u00edch AI Phishing $<2\\text{s}$; Th\u1eddi gian RAG Chatbot sinh c\u00e2u tr\u1ea3 l\u1eddi $<3\\text{s}$.\n2.  **B\u1ea3o m\u1eadt & Ki\u1ec3m so\u00e1t An to\u00e0n (Security & Safety)**:\n    *   **Gi\u1edbi h\u1ea1n Payload**: Gi\u1edbi h\u1ea1n Request Body t\u1ed1i \u0111a $1\\text{MB}$ (`MaxAllowedPayload`).\n    *   **Rate Limiting k\u00e9p**: T\u1ed1i \u0111a 100 req/ph\u00fat to\u00e0n c\u1ee5c; T\u1ed1i \u0111a 15 req/15 ph\u00fat cho Auth; T\u1ed1i \u0111a 5 req/5 ph\u00fat cho g\u1eedi \u0111\u01a1n b\u00e1o c\u00e1o.\n    *   **M\u00e3 h\u00f3a & Ph\u00e2n quy\u1ec1n**: Token JWT m\u00e3 h\u00f3a b\u1ea5t \u0111\u1ed1i \u1ee9ng **RSA RS256**; Ph\u00e2n quy\u1ec1n RBAC nghi\u00eam ng\u1eb7t (`RequireRole`); Gi\u1edbi h\u1ea1n IP Whitelist v\u00f9ng Admin.\n3.  **T\u00ednh S\u1eb5n s\u00e0ng & Tin c\u1eady (Availability & Reliability)**:\n    *   H\u1ec7 th\u1ed1ng \u0111\u1ea1t ch\u1ec9 s\u1ed1 s\u1eb5n s\u00e0ng Uptime $\\ge 99.9\\%$.\n    *   T\u1ef1 \u0111\u1ed9ng k\u00edch ho\u1ea1t c\u01a1 ch\u1ebf d\u1ef1 ph\u00f2ng **Fallback** (tr\u1ea3 Risk Score 50%) khi AI Service g\u1eb7p s\u1ef1 c\u1ed1 ng\u1eaft m\u1ea1ng ho\u1eb7c h\u1ebft quota API.\n4.  **Kh\u1ea3 n\u0103ng B\u1ea3o v\u1ec7 Quy\u1ec1n ri\u00eang t\u01b0 t\u1ea1i bi\u00ean (Client-side Privacy)**:\n    *   100% d\u1eef li\u1ec7u nh\u1ea1y c\u1ea3m l\u00e0m m\u1edd (DataBlur) ph\u1ea3i \u0111\u01b0\u1ee3c x\u1eed l\u00fd c\u1ee5c b\u1ed9 tr\u00ean m\u00e1y client, tuy\u1ec7t \u0111\u1ed1i kh\u00f4ng g\u1eedi v\u0103n b\u1ea3n th\u00f4 c\u1ee7a ng\u01b0\u1eddi d\u00f9ng v\u1ec1 m\u00e1y ch\u1ee7.\n\n---\n\n## CH\u01af\u01a0NG III: THI\u1ebeT K\u1ebe K\u1ef8 THU\u1eacT V\u00c0 KI\u1ebeN TR\u00daC H\u1ec6 TH\u1ed0NG\n\n### 3.1. S\u01a1 \u0111\u1ed3 Ki\u1ebfn tr\u00fac Ph\u00e2n t\u1ea7ng T\u1ed5ng quan (Architecture Diagram)\n\nT\u1eeb c\u00e1c ph\u00e2n t\u00edch y\u00eau c\u1ea7u \u1edf Ch\u01b0\u01a1ng II, h\u1ec7 th\u1ed1ng KiGuard \u0111\u01b0\u1ee3c thi\u1ebft k\u1ebf theo m\u00f4 h\u00ecnh ki\u1ebfn tr\u00fac d\u1ecbch v\u1ee5 ph\u00e2n t\u1ea7ng (**Layered Microservices Architecture**) nh\u1eb1m \u0111\u1ea3m b\u1ea3o t\u00ednh \u0111\u1ed9c l\u1eadp v\u00e0 kh\u1ea3 n\u0103ng m\u1edf r\u1ed9ng:\n\n```mermaid\nflowchart TD\n    subgraph ClientLayer [\"L\u1edbp Client Giao di\u1ec7n\"]\n        FE[\"Web UI - React Vite\"]\n        EXT[\"Extension - Vue.js Tailwind\"]\n        TG[\"Telegram Bot - Python\"]\n    end\n\n    subgraph CoreBackend [\"L\u1edbp Gateway v\u00e0 Core Backend - Go Gin\"]\n        BE_AUTH[\"Backend Auth - Port 8081\"]\n        BE_CHECK[\"Backend Check - Port 8082\"]\n    end\n\n    subgraph AIServiceLayer [\"L\u1edbp AI v\u00e0 Ph\u00e2n t\u00edch \u0111\u1ed9c h\u1ea1i\"]\n        AI_PHISH[\"AI Phishing Detector - FastAPI\"]\n        AI_ANM[\"AI ANM Security Chatbot - FastAPI\"]\n    end\n\n    subgraph DatabaseLayer [\"L\u1edbp D\u1eef li\u1ec7u v\u00e0 D\u1ecbch v\u1ee5 ngo\u00e0i\"]\n        DB_CUCKOO[\"Cuckoo Filter tr\u00ean RAM\"]\n        DB_MONGO[(\"MongoDB Database - Port 27017\")]\n        DB_VECTOR[(\"Vector DB - FAISS Pinecone\")]\n        APIS[\"External APIs - Gemini WHOIS DNS\"]\n    end\n\n    subgraph BackgroundLayer [\"L\u1edbp ch\u1ea1y ng\u1ea7m\"]\n        CRAWLER[\"Crawler Scripts - Python\"]\n    end\n\n    FE --> BE_AUTH\n    EXT --> BE_CHECK\n    TG --> BE_CHECK\n    BE_CHECK --> DB_CUCKOO\n    BE_CHECK --> DB_MONGO\n    BE_CHECK --> AI_PHISH\n    \n    AI_PHISH --> APIS\n    AI_ANM --> DB_VECTOR\n    AI_ANM --> APIS\n    \n    CRAWLER --> DB_MONGO\n    CRAWLER --> DB_CUCKOO\n```\n\n---\n\n### 3.2. S\u01a1 \u0111\u1ed3 Lu\u1ed3ng K\u1ef9 thu\u1eadt Thu\u1eadt to\u00e1n (Flowchart Diagram)\n\nS\u01a1 \u0111\u1ed3 m\u00f4 t\u1ea3 chi ti\u1ebft thu\u1eadt to\u00e1n ki\u1ec3m tra URL 2 t\u1ea7ng t\u1ea1i Backend Check, t\u00edch h\u1ee3p c\u01a1 ch\u1ebf ch\u1ed1ng ngh\u1ebdn `singleflight.Group`, ph\u00e2n t\u00edch AI d\u1ef1 ph\u00f2ng v\u00e0 h\u00e0ng \u0111\u1ee3i \u0111\u1ec7m ghi log b\u1ea5t \u0111\u1ed3ng b\u1ed9 (Batch Logging Worker):\n\n```mermaid\nflowchart TD\n    Start([B\u1eaft \u0111\u1ea7u qu\u00e9t URL]) --> Recv[Backend Check nh\u1eadn URL t\u1eeb Extension]\n    Recv --> LookupCuckoo{Ki\u1ec3m tra Cuckoo Filter tr\u00ean RAM}\n    \n    LookupCuckoo -- C\u00f3 trong Filter --> VerifyDB[Tra c\u1ee9u MongoDB x\u00e1c nh\u1eadn]\n    VerifyDB --> ResFast[Tr\u1ea3 v\u1ec1 k\u1ebft qu\u1ea3 Safe ho\u1eb7c Unsafe d\u01b0\u1edbi 50ms]\n    \n    LookupCuckoo -- Kh\u00f4ng c\u00f3 trong Filter --> SingleFlight{Singleflight Group: Tr\u00f9ng Request?}\n    \n    SingleFlight -- C\u00f3 --> WaitResult[Ch\u1edd k\u1ebft qu\u1ea3 Request \u0111ang ch\u1ea1y]\n    SingleFlight -- Kh\u00f4ng --> CallAI[G\u1eedi URL sang AI Phishing Service]\n    \n    CallAI --> CollectInfo[Thu th\u1eadp DOM WHOIS DNS]\n    CollectInfo --> LLMScore[Gemini LLM ch\u1ea5m \u0111i\u1ec3m r\u1ee7i ro]\n    LLMScore --> CacheDB[Ghi cache v\u00e0o MongoDB v\u00e0 Filter]\n    CacheDB --> ResFast\n    WaitResult --> ResFast\n    \n    ResFast --> PushChan[\u0110\u1ea9y log v\u00e0o Go Channel \u0111\u1ec7m 10000 slot]\n    PushChan --> BatchWorker{Batch Worker: \u0110\u1ee7 100 log ho\u1eb7c tr\u00f2n 1s?}\n    BatchWorker -- C\u00f3 --> BulkWrite[Bulk Write h\u00e0ng lo\u1ea1t log v\u00e0o MongoDB]\n    BatchWorker -- Ch\u01b0a --> KeepBuf[T\u00edch l\u0169y ti\u1ebfp trong b\u1ed9 \u0111\u1ec7m]\n    BulkWrite --> End([K\u1ebft th\u00fac])\n    KeepBuf --> End\n```\n\n---\n\n### 3.3. S\u01a1 \u0111\u1ed3 Quy tr\u00ecnh Nghi\u1ec7p v\u1ee5 Ki\u1ec3m duy\u1ec7t (BPMN Swimlane Diagram)\n\nBi\u1ec3u di\u1ec5n quy tr\u00ecnh nghi\u1ec7p v\u1ee5 ti\u1ebfp nh\u1eadn \u0111\u01a1n b\u00e1o c\u00e1o t\u1eeb ng\u01b0\u1eddi d\u00f9ng, AI t\u1ef1 \u0111\u1ed9ng \u0111\u00e1nh gi\u00e1 v\u00e0 Moderator ph\u00ea duy\u1ec7t qua **5 l\u00e0n ranh gi\u1edbi tr\u00e1ch nhi\u1ec7m (Swimlanes)**:\n\n```mermaid\nflowchart TD\n    subgraph Swimlane_User [\"Swimlane 1: Ng\u01b0\u1eddi d\u00f9ng Client\"]\n        A1([Ph\u00e1t hi\u1ec7n URL l\u1eeba \u0111\u1ea3o]) --> A2[G\u1eedi \u0111\u01a1n b\u00e1o c\u00e1o nghi ng\u1edd]\n    end\n\n    subgraph Swimlane_System [\"Swimlane 2: Extension v\u00e0 Backend Gateway\"]\n        A2 --> B1[X\u00e1c th\u1ef1c JWT Token v\u00e0 Gi\u1edbi h\u1ea1n Rate Limit]\n        B1 --> B2[T\u1ea1o b\u1ea3n ghi Report tr\u1ea1ng th\u00e1i PENDING]\n    end\n\n    subgraph Swimlane_AI [\"Swimlane 3: AI Phishing Sub-system\"]\n        B2 --> C1[T\u1ef1 \u0111\u1ed9ng thu th\u1eadp DOM WHOIS DNS]\n        C1 --> C2[Gemini LLM \u0111\u00e1nh gi\u00e1 v\u00e0 ch\u1ea5m \u0111i\u1ec3m r\u1ee7i ro]\n        C2 --> C3[C\u1eadp nh\u1eadt \u0111i\u1ec3m r\u1ee7i ro AI v\u00e0o \u0111\u01a1n b\u00e1o c\u00e1o]\n    end\n\n    subgraph Swimlane_Mod [\"Swimlane 4: \u0110i\u1ec1u h\u00e0nh vi\u00ean Moderator\"]\n        C3 --> D1[Xem danh s\u00e1ch b\u00e1o c\u00e1o ch\u1edd duy\u1ec7t]\n        D1 --> D2{\u0110\u00e1nh gi\u00e1 ki\u1ec3m duy\u1ec7t?}\n        D2 -- Ph\u00ea duy\u1ec7t --> D3[Chuy\u1ec3n tr\u1ea1ng th\u00e1i APPROVED]\n        D2 -- T\u1eeb ch\u1ed1i --> D4[Chuy\u1ec3n tr\u1ea1ng th\u00e1i REJECTED]\n    end\n\n    subgraph Swimlane_DB [\"Swimlane 5: CSDL v\u00e0 B\u1ed9 l\u1ecdc RAM\"]\n        D3 --> E1[L\u01b0u URL \u0111\u1ed9c h\u1ea1i v\u00e0o MongoDB]\n        E1 --> E2[\u0110\u1ed3ng b\u1ed9 t\u1ee9c th\u00ec v\u00e0o Cuckoo Filter tr\u00ean RAM]\n    end\n\n    E2 --> End1([K\u1ebft th\u00fac: URL b\u1ecb ch\u1eb7n to\u00e0n h\u1ec7 th\u1ed1ng])\n    D4 --> End2([K\u1ebft th\u00fac: H\u1ee7y b\u00e1o c\u00e1o])\n```\n\n---\n\n### 3.4. C\u00e1c Bi\u1ec3u \u0111\u1ed3 Tu\u1ea7n t\u1ef1 H\u1ec7 th\u1ed1ng (Sequence Diagrams)\n\n#### 3.4.1. Quy tr\u00ecnh \u0110\u0103ng k\u00fd t\u00e0i kho\u1ea3n b\u1eb1ng Passkey (WebAuthn Flow)\nBi\u1ec3u \u0111\u1ed3 tu\u1ea7n t\u1ef1 m\u00f4 t\u1ea3 quy tr\u00ecnh kh\u1edfi t\u1ea1o c\u1eb7p kh\u00f3a m\u00e3 h\u00f3a b\u1ea5t \u0111\u1ed1i \u1ee9ng FIDO2/WebAuthn gi\u1eefa tr\u00ecnh duy\u1ec7t ng\u01b0\u1eddi d\u00f9ng v\u00e0 Backend Auth:\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor User as Ng\u01b0\u1eddi d\u00f9ng\n    participant Client as Frontend React App\n    participant Auth as Backend Auth Go\n    participant AuthAPI as Tr\u00ecnh duy\u1ec7t WebAuthn API\n    participant DB as MongoDB\n    \n    User->>Client: Y\u00eau c\u1ea7u \u0111\u0103ng k\u00fd Passkey\n    Client->>Auth: L\u1ea5y th\u00f4ng s\u1ed1 c\u1ea5u h\u00ecnh (POST /passkey/register/begin)\n    Auth-->>Client: Tr\u1ea3 v\u1ec1 Options (Challenge, RP ID)\n    \n    Client->>AuthAPI: G\u1ecdi navigator.credentials.create(options)\n    AuthAPI->>User: Y\u00eau c\u1ea7u v\u00e2n tay ho\u1eb7c khu\u00f4n m\u1eb7t\n    User->>AuthAPI: X\u00e1c nh\u1eadn sinh tr\u1eafc h\u1ecdc th\u00e0nh c\u00f4ng\n    AuthAPI-->>Client: Tr\u1ea3 v\u1ec1 Credential (Kh\u00f3a c\u00f4ng khai)\n    \n    Client->>Auth: G\u1eedi Credential x\u00e1c th\u1ef1c (POST /passkey/register/finish)\n    Auth->>DB: L\u01b0u kh\u00f3a c\u00f4ng khai v\u00e0o CSDL\n    DB-->>Auth: OK\n    Auth-->>Client: \u0110\u0103ng k\u00fd th\u00e0nh c\u00f4ng\n    Client-->>User: Hi\u1ec3n th\u1ecb th\u00f4ng b\u00e1o th\u00e0nh c\u00f4ng\n```\n\n#### 3.4.2. Quy tr\u00ecnh Ki\u1ec3m tra URL t\u00edch h\u1ee3p AI v\u00e0 Cache (URL Verification Flow)\nM\u00f4 t\u1ea3 tu\u1ea7n t\u1ef1 c\u00e1c th\u00f4ng \u0111i\u1ec7p trao \u0111\u1ed5i gi\u1eefa Extension, Backend Check, Cuckoo Filter RAM v\u00e0 AI Phishing Service:\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor User as Ng\u01b0\u1eddi d\u00f9ng\n    participant Client as Extension Client\n    participant Check as Backend Check Go\n    participant DB as MongoDB CSDL\n    participant Phish as AI Phishing API\n\n    User->>Client: Truy c\u1eadp trang web\n    Client->>Check: G\u1eedi URL c\u1ea7n qu\u00e9t (POST /check)\n    Check->>Check: Qu\u00e9t Cuckoo Filter tr\u00ean RAM\n    \n    alt URL n\u1eb1m trong Cuckoo Filter\n        Check->>DB: Tra c\u1ee9u x\u00e1c th\u1ef1c d\u1eef li\u1ec7u\n        DB-->>Check: Tr\u1ea3 v\u1ec1 k\u1ebft qu\u1ea3\n        Check-->>Client: Tr\u1ea3 tr\u1ea1ng th\u00e1i Unsafe ho\u1eb7c Safe\n        Client-->>User: Hi\u1ec3n th\u1ecb c\u1ea3nh b\u00e1o ho\u1eb7c cho ph\u00e9p truy c\u1eadp\n    else URL ch\u01b0a c\u00f3 trong b\u1ed9 l\u1ecdc\n        Check->>Phish: G\u1eedi y\u00eau c\u1ea7u qu\u00e9t \u0111\u1ed9ng (POST /api/v1/detect)\n        Note over Phish: Thu th\u1eadp DNS/WHOIS/DOM\n        Note over Phish: Gemini LLM ph\u00e2n t\u00edch r\u1ee7i ro\n        Phish-->>Check: Tr\u1ea3 v\u1ec1 \u0111i\u1ec3m s\u1ed1 r\u1ee7i ro\n        Check->>DB: Ghi cache d\u1eef li\u1ec7u v\u00e0 ghi logs\n        Check-->>Client: Tr\u1ea3 k\u1ebft qu\u1ea3 ph\u00e2n t\u00edch AI\n        Client-->>User: Hi\u1ec3n th\u1ecb ph\u00e2n t\u00edch an to\u00e0n chi ti\u1ebft\n    end\n```\n\n---\n\n### 3.5. Bi\u1ec3u \u0111\u1ed3 Ho\u1ea1t \u0111\u1ed9ng Tr\u1ee3 l\u00fd An ninh (Activity Diagram)\n\nM\u00f4 t\u1ea3 ho\u1ea1t \u0111\u1ed9ng c\u1ee7a Chatbot Lu\u1eadt ANM khi th\u1ef1c hi\u1ec7n nh\u00fang c\u00e2u h\u1ecfi, truy h\u1ed3i ng\u1eef c\u1ea3nh t\u01b0\u01a1ng \u0111\u1ed3ng tr\u00ean Vector DB v\u00e0 \u0111\u1ecbnh d\u1ea1ng c\u00e2u tr\u1ea3 l\u1eddi:\n\n```mermaid\nflowchart LR\n    Start([B\u1eaft \u0111\u1ea7u]) --> Input[\"Nh\u1eadp c\u00e2u h\u1ecfi\"]\n    Input --> Embed[\"Nh\u00fang Vector\"]\n    Embed --> Query[\"Truy v\u1ea5n Vector DB\"]\n    Query --> Check{\"C\u00f3 d\u1eef li\u1ec7u ph\u00f9 h\u1ee3p?\"}\n\n    Check -- C\u00f3 --> Prompt[\"Gh\u00e9p lu\u1eadt t\u1ea1o Prompt\"]\n    Check -- Kh\u00f4ng --> Fallback[\"Kh\u1edfi t\u1ea1o Prompt d\u1ef1 ph\u00f2ng\"]\n\n    Prompt --> Gemini[\"G\u1ecdi Gemini API\"]\n    Fallback --> Gemini\n\n    Gemini --> Format{\"\u0110\u00fang c\u1ea5u tr\u00fac ti\u00eau chu\u1ea9n?\"}\n    \n    Format -- C\u00f3 --> Save[\"L\u01b0u l\u1ecbch s\u1eed v\u00e0o MongoDB\"]\n    Format -- Kh\u00f4ng --> Reformat[\"\u0110\u1ecbnh d\u1ea1ng l\u1ea1i c\u00e2u tr\u1ea3 l\u1eddi\"]\n    \n    Reformat --> Save\n    Save --> Output[\"Hi\u1ec3n th\u1ecb c\u00e2u tr\u1ea3 l\u1eddi\"]\n    Output --> End([K\u1ebft th\u00fac])\n```\n\n---\n\n### 3.6. Thi\u1ebft k\u1ebf CSDL v\u00e0 Th\u1ef1c th\u1ec3 Quan h\u1ec7 (ERD & Data Dictionary)\n\nM\u00f4 t\u1ea3 thi\u1ebft k\u1ebf c\u01a1 s\u1edf d\u1eef li\u1ec7u MongoDB NoSQL \u1ee9ng d\u1ee5ng hai chi\u1ebfn l\u01b0\u1ee3c: **Nh\u00fang (Embedding)** cho d\u1eef li\u1ec7u Passkeys v\u00e0 **Tham chi\u1ebfu (Referencing)** cho c\u00e1c b\u1ea3n ghi \u0111\u01a1n b\u00e1o c\u00e1o.\n\n```mermaid\nerDiagram\n    USER ||--o{ CREDENTIAL : \"nhung Embedded\"\n    USER ||--o{ REPORT : \"gui Referenced\"\n    REPORT }|--|| SCAMURL : \"tao nen Referenced\"\n\n    USER {\n        string id PK\n        string username\n        string email\n        string passwordHash\n        string role\n        string createdAt\n    }\n\n    CREDENTIAL {\n        string credentialId PK\n        string publicKey\n        uint32 signCount\n    }\n\n    REPORT {\n        string id PK\n        string reportedUrl\n        string description\n        string reporterId FK\n        string status\n        string submittedAt\n    }\n\n    SCAMURL {\n        string id PK\n        string url\n        string domain\n        string status\n        string createdBy\n        string createdAt\n    }\n\n    ALLOWURL {\n        string id PK\n        string url\n        string domain\n        string createdAt\n    }\n\n    CHECKLOG {\n        string id PK\n        string url\n        string domain\n        string ipAddress\n        string userAgent\n        string result\n        string checkedAt\n    }\n```\n\n#### T\u1eeb \u0111i\u1ec3n D\u1eef li\u1ec7u Chi ti\u1ebft (Data Dictionary Tables):\n\n##### 1. Collection `users` (Qu\u1ea3n l\u00fd H\u1ed3 s\u01a1 T\u00e0i kho\u1ea3n & Passkeys)\n| T\u00ean Tr\u01b0\u1eddng (Field) | Ki\u1ec3u D\u1eef Li\u1ec7u | R\u00e0ng bu\u1ed9c (Constraints) | Gi\u1ea3i th\u00edch \u00dd ngh\u0129a K\u1ef9 thu\u1eadt |\n| :--- | :---: | :---: | :--- |\n| `_id` | `ObjectID` | Primary Key | M\u00e3 \u0111\u1ecbnh danh duy nh\u1ea5t c\u1ee7a ng\u01b0\u1eddi d\u00f9ng trong MongoDB. |\n| `username` | `String` | Unique, Index | T\u00ean t\u00e0i kho\u1ea3n ng\u01b0\u1eddi d\u00f9ng (ki\u1ec3m tra tr\u00f9ng l\u1eb7p th\u1eddi gian th\u1ef1c). |\n| `email` | `String` | Unique, Index | \u0110\u1ecba ch\u1ec9 email \u0111\u0103ng k\u00fd h\u1ec7 th\u1ed1ng. |\n| `password_hash`| `String` | Bcrypt Encrypted| Chu\u1ed7i m\u1eadt kh\u1ea9u \u0111\u00e3 \u0111\u01b0\u1ee3c m\u00e3 h\u00f3a Bcrypt an to\u00e0n. |\n| `role` | `String` | Enum | Vai tr\u00f2 ph\u00e2n quy\u1ec1n: `super_admin`, `admin`, `moderator`, `user`. |\n| `passkeys` | `Array[Object]`| Embedded Document| Danh s\u00e1ch c\u00e1c thi\u1ebft b\u1ecb Passkey nh\u00fang tr\u1ef1c ti\u1ebfp (`credential_id`, `public_key`, `sign_count`). |\n| `created_at` | `DateTime` | Auto-generated | Th\u1eddi \u0111i\u1ec3m t\u1ea1o t\u00e0i kho\u1ea3n. |\n\n##### 2. Collection `scam_urls` (Danh s\u00e1ch \u0110en T\u00ean mi\u1ec1n L\u1eeba \u0111\u1ea3o)\n| T\u00ean Tr\u01b0\u1eddng (Field) | Ki\u1ec3u D\u1eef Li\u1ec7u | R\u00e0ng bu\u1ed9c (Constraints) | Gi\u1ea3i th\u00edch \u00dd ngh\u0129a K\u1ef9 thu\u1eadt |\n| :--- | :---: | :---: | :--- |\n| `_id` | `ObjectID` | Primary Key | M\u00e3 \u0111\u1ecbnh danh b\u1ea3n ghi URL l\u1eeba \u0111\u1ea3o. |\n| `url` | `String` | Index, Unique | \u0110\u01b0\u1eddng d\u1eabn URL tuy\u1ec7t \u0111\u1ed1i b\u1ecb x\u00e1c minh l\u1eeba \u0111\u1ea3o. |\n| `domain` | `String` | B-Tree Index | T\u00ean mi\u1ec1n g\u1ed1c (Domain) ph\u1ee5c v\u1ee5 tra c\u1ee9u nhanh. |\n| `reason` | `String` | Required | L\u00fd do vi ph\u1ea1m (Gi\u1ea3 m\u1ea1o ng\u00e2n h\u00e0ng, Phishing Facebook,...). |\n| `threat_level` | `String` | Enum | M\u1ee9c \u0111\u1ed9 \u0111e d\u1ecda: `CRITICAL`, `HIGH`, `MEDIUM`, `LOW`. |\n| `created_by` | `String` | FK Reference | M\u00e3 \u0111\u1ecbnh danh c\u1ee7a Admin/Moderator/Crawler th\u00eam URL v\u00e0o. |\n| `created_at` | `DateTime` | Index | Th\u1eddi \u0111i\u1ec3m th\u00eam v\u00e0o danh s\u00e1ch \u0111en. |\n\n##### 3. Collection `reports` (\u0110\u01a1n B\u00e1o c\u00e1o c\u1ee7a Ng\u01b0\u1eddi d\u00f9ng)\n| T\u00ean Tr\u01b0\u1eddng (Field) | Ki\u1ec3u D\u1eef Li\u1ec7u | R\u00e0ng bu\u1ed9c (Constraints) | Gi\u1ea3i th\u00edch \u00dd ngh\u0129a K\u1ef9 thu\u1eadt |\n| :--- | :---: | :---: | :--- |\n| `_id` | `ObjectID` | Primary Key | M\u00e3 \u0111\u1ecbnh danh \u0111\u01a1n b\u00e1o c\u00e1o. |\n| `reported_url` | `String` | Required | \u0110\u01b0\u1eddng d\u1eabn URL nghi ng\u1edd l\u1eeba \u0111\u1ea3o do ng\u01b0\u1eddi d\u00f9ng g\u1eedi. |\n| `description` | `String` | Text | M\u00f4 t\u1ea3 chi ti\u1ebft h\u00e0nh vi l\u1eeba \u0111\u1ea3o t\u1eeb ng\u01b0\u1eddi d\u00f9ng. |\n| `reporter_id` | `ObjectID` | FK -> `users._id` | M\u00e3 ng\u01b0\u1eddi d\u00f9ng g\u1eedi b\u00e1o c\u00e1o (Tham chi\u1ebfu). |\n| `status` | `String` | Enum, Index | Tr\u1ea1ng th\u00e1i \u0111\u01a1n: `PENDING`, `APPROVED`, `REJECTED`, `APPEALED`. |\n| `risk_score` | `Float` | 0.0 - 100.0 | \u0110i\u1ec3m s\u1ed1 r\u1ee7i ro do AI Phishing Service t\u1ef1 \u0111\u1ed9ng ch\u1ea5m. |\n| `ai_analysis` | `Object` | JSON Details | Chi ti\u1ebft b\u1eb1ng ch\u1ee9ng th\u00f4 c\u00e0o \u0111\u01b0\u1ee3c (WHOIS, DNS, HTML DOM). |\n\n##### 4. Collection `check_logs` (Nh\u1eadt k\u00fd Qu\u00e9t URL B\u1ea5t \u0111\u1ed3ng b\u1ed9)\n| T\u00ean Tr\u01b0\u1eddng (Field) | Ki\u1ec3u D\u1eef Li\u1ec7u | R\u00e0ng bu\u1ed9c (Constraints) | Gi\u1ea3i th\u00edch \u00dd ngh\u0129a K\u1ef9 thu\u1eadt |\n| :--- | :---: | :---: | :--- |\n| `_id` | `ObjectID` | Primary Key | M\u00e3 \u0111\u1ecbnh danh b\u1ea3n ghi log. |\n| `url` | `String` | Index | URL \u0111\u01b0\u1ee3c ng\u01b0\u1eddi d\u00f9ng g\u1eedi y\u00eau c\u1ea7u qu\u00e9t. |\n| `domain` | `String` | Index | T\u00ean mi\u1ec1n t\u01b0\u01a1ng \u1ee9ng. |\n| `ip_address` | `String` | Network IPv4/v6 | \u0110\u1ecba ch\u1ec9 IP c\u1ee7a Client th\u1ef1c hi\u1ec7n qu\u00e9t. |\n| `user_agent` | `String` | Client Header | Th\u00f4ng tin tr\u00ecnh duy\u1ec7t/Extension ph\u00e1t l\u1ea1i request. |\n| `result` | `String` | Enum | K\u1ebft qu\u1ea3 tr\u1ea3 v\u1ec1: `SAFE`, `UNSAFE`, `UNKNOWN`. |\n| `checked_at` | `DateTime` | TTL Index | Th\u1eddi \u0111i\u1ec3m th\u1ef1c hi\u1ec7n qu\u00e9t (T\u1ef1 \u0111\u1ed9ng h\u1ee7y log c\u0169 sau 90 ng\u00e0y). |\n\n---\n\n### 3.7. S\u01a1 \u0111\u1ed3 Chuy\u1ec3n Tr\u1ea1ng th\u00e1i (State Machine Diagram)\n\nBi\u1ec3u di\u1ec5n to\u00e0n b\u1ed9 v\u00f2ng \u0111\u1eddi chuy\u1ec3n \u0111\u1ed5i tr\u1ea1ng th\u00e1i c\u1ee7a \u0111\u01a1n b\u00e1o c\u00e1o l\u1eeba \u0111\u1ea3o v\u00e0 t\u00ean mi\u1ec1n b\u1ecb ch\u1eb7n trong h\u1ec7 th\u1ed1ng KiGuard:\n\n```mermaid\nstateDiagram-v2\n    [*] --> Pending: Ng\u01b0\u1eddi d\u00f9ng g\u1eedi b\u00e1o c\u00e1o URL\n\n    state Pending {\n        [*] --> QueuedAI\n        QueuedAI --> AI_Analyzing: Collector c\u00e0o WHOIS DNS DOM\n        AI_Analyzing --> AI_Scored: Gemini LLM ch\u1ea5m \u0111i\u1ec3m r\u1ee7i ro\n    }\n\n    Pending --> Moderator_Review: Chuy\u1ec3n sang h\u00e0ng ch\u1edd Moderator\n\n    state Moderator_Review {\n        [*] --> Reviewing\n        Reviewing --> Approved: Moderator Ph\u00ea duy\u1ec7t\n        Reviewing --> Rejected: Moderator T\u1eeb ch\u1ed1i\n    }\n\n    Approved --> Blacklisted: Th\u00eam v\u00e0o MongoDB v\u00e0 RAM Cuckoo Filter\n    Rejected --> [*]: \u0110\u00f3ng b\u00e1o c\u00e1o\n\n    Blacklisted --> Appealed: Ng\u01b0\u1eddi d\u00f9ng g\u1eedi khi\u1ebfu n\u1ea1i\n    Appealed --> Whitelisted: Admin ho\u1eb7c Mod duy\u1ec7t g\u1ee1 ch\u1eb7n\n    \n    Whitelisted --> [*]\n```\n\n---\n\n## CH\u01af\u01a0NG IV: C\u00c0I \u0110\u1eb6T V\u00c0 KH\u1ea2O S\u00c1T K\u1ebeT QU\u1ea2\n\n### 4.1. Giao di\u1ec7n v\u00e0 m\u00f4i tr\u01b0\u1eddng c\u00e0i \u0111\u1eb7t th\u1ef1c t\u1ebf\nH\u1ec7 sinh th\u00e1i KiGuard \u0111\u00e3 \u0111\u01b0\u1ee3c tri\u1ec3n khai ch\u1ea1y th\u1eed nghi\u1ec7m tr\u00ean m\u00f4i tr\u01b0\u1eddng c\u1ee5c b\u1ed9 (Localhost) v\u1edbi c\u00e1c c\u1ed5ng d\u1ecbch v\u1ee5 \u0111\u01b0\u1ee3c c\u1ea5u h\u00ecnh nh\u01b0 sau:\n*   **Backend Auth (Go Gin)**: C\u1ed5ng `8081` - Qu\u1ea3n l\u00fd t\u00e0i kho\u1ea3n v\u00e0 Passkeys.\n*   **Backend Check (Go Gin)**: C\u1ed5ng `8082` - X\u1eed l\u00fd ki\u1ec3m tra URL v\u00e0 Cuckoo Filter.\n*   **Frontend Web (React + Vite)**: C\u1ed5ng `5173` - Cung c\u1ea5p Dashboard qu\u1ea3n tr\u1ecb.\n*   **AI Phishing Service (FastAPI)**: C\u1ed5ng `8000` - Qu\u00e9t b\u1eb1ng ch\u1ee9ng v\u00e0 g\u1ecdi Gemini API.\n*   **AI ANM Chatbot (FastAPI)**: C\u1ed5ng `8003` - Tra c\u1ee9u lu\u1eadt an ninh m\u1ea1ng RAG.\n*   **Ti\u1ec7n \u00edch tr\u00ecnh duy\u1ec7t (Chrome Extension)**: \u0110\u01b0\u1ee3c \u0111\u00f3ng g\u00f3i v\u00e0 c\u00e0i \u0111\u1eb7t th\u00e0nh c\u00f4ng d\u01b0\u1edbi d\u1ea1ng Unpacked Extension tr\u00ean tr\u00ecnh duy\u1ec7t Google Chrome.\n\n### 4.2. K\u1ecbch b\u1ea3n th\u1eed nghi\u1ec7m ki\u1ec3m so\u00e1t quy\u1ec1n ri\u00eang t\u01b0 (Data Blur Testing)\n1.  **M\u1ee5c ti\u00eau th\u1eed nghi\u1ec7m**: \u0110\u00e1nh gi\u00e1 kh\u1ea3 n\u0103ng t\u1ef1 \u0111\u1ed9ng ph\u00e1t hi\u1ec7n v\u00e0 l\u00e0m m\u1edd c\u00e1c th\u00f4ng tin nh\u1ea1y c\u1ea3m c\u1ee7a module `DataBlurShield.js`.\n2.  **K\u1ecbch b\u1ea3n**: \n    *   Ng\u01b0\u1eddi d\u00f9ng truy c\u1eadp v\u00e0o m\u1ed9t trang web c\u00f3 ch\u1ee9a c\u00e1c th\u00f4ng tin d\u1ea1ng text bao g\u1ed3m \u0111\u1ecba ch\u1ec9 Email (`test@gmail.com`), s\u1ed1 \u0111i\u1ec7n tho\u1ea1i (`0987654321`) v\u00e0 s\u1ed1 th\u1ebb t\u00edn d\u1ee5ng gi\u1ea3 l\u1eadp.\n    *   *K\u1ebft qu\u1ea3*: Tr\u00ecnh duy\u1ec7t ngay l\u1eadp t\u1ee9c k\u00edch ho\u1ea1t MutationObserver, so kh\u1edbp bi\u1ec3u th\u1ee9c ch\u00ednh quy (Regex) v\u00e0 chuy\u1ec3n \u0111\u1ed5i c\u00e1c \u0111o\u1ea1n v\u0103n b\u1ea3n nh\u1ea1y c\u1ea3m n\u00e0y th\u00e0nh c\u00e1c th\u1ebb `<span class=\"kiguard-blurred\">` l\u00e0m m\u1edd n\u1ed9i dung. Khi ng\u01b0\u1eddi d\u00f9ng r\u00ea chu\u1ed9t (hover) v\u00e0o, th\u00f4ng tin m\u1edbi hi\u1ec3n th\u1ecb r\u00f5.\n3.  **Th\u1eed nghi\u1ec7m t\u00ednh n\u0103ng Drag-to-blur**:\n    *   Ng\u01b0\u1eddi d\u00f9ng b\u1eadt thanh Floating Toolbar, ch\u1ecdn ch\u1ebf \u0111\u1ed9 qu\u00e9t v\u00f9ng (Area Mode) v\u00e0 k\u00e9o chu\u1ed9t v\u1ebd m\u1ed9t h\u00ecnh ch\u1eef nh\u1eadt che \u0111\u00e8 l\u00ean m\u1ed9t \u1ea3nh th\u1ebb ch\u1ee9a c\u0103n c\u01b0\u1edbc c\u00f4ng d\u00e2n.\n    *   *K\u1ebft qu\u1ea3*: H\u1ec7 th\u1ed1ng t\u1ef1 \u0111\u1ed9ng t\u1ea1o ra m\u1ed9t th\u1ebb `div` \u0111\u00e8 l\u00ean v\u1ecb tr\u00ed t\u01b0\u01a1ng \u0111\u1ed1i c\u1ee7a v\u00f9ng \u0111\u01b0\u1ee3c khoanh v\u1edbi b\u1ed9 l\u1ecdc CSS `backdrop-filter: blur(12px)`, b\u1ea3o v\u1ec7 th\u00e0nh c\u00f4ng th\u00f4ng tin h\u00ecnh \u1ea3nh tr\u01b0\u1edbc khi chia s\u1ebb.\n\n---\n\n## CH\u01af\u01a0NG V: K\u1ebeT LU\u1eacN V\u00c0 H\u01af\u1edaNG PH\u00c1T TRI\u1ec2N\n\n### 1. K\u1ebft qu\u1ea3 \u0111\u1ea1t \u0111\u01b0\u1ee3c\nH\u1ec7 sinh th\u00e1i **KiGuard** \u0111\u00e3 ho\u00e0n th\u00e0nh \u0111\u1ea7y \u0111\u1ee7 c\u00e1c m\u1ee5c ti\u00eau \u0111\u1ec1 ra:\n*   Ph\u00e2n t\u00edch v\u00e0 ph\u00e2n r\u00e3 ch\u00ednh x\u00e1c 5 t\u00e1c nh\u00e2n h\u1ec7 th\u1ed1ng \u0111\u1ec3 thi\u1ebft k\u1ebf ki\u1ebfn tr\u00fac ph\u1ea7n m\u1ec1m m\u1ea1ch l\u1ea1c, t\u1ed1i \u01b0u hi\u1ec7u n\u0103ng.\n*   X\u00e2y d\u1ef1ng th\u00e0nh c\u00f4ng l\u00f5i Backend Check b\u1eb1ng Go \u0111\u1ea1t th\u1eddi gian x\u1eed l\u00fd c\u1ef1c nhanh nh\u1edd c\u1ea5u tr\u00fac d\u1eef li\u1ec7u Cuckoo Filter v\u00e0 c\u01a1 ch\u1ebf ghi log b\u1ea5t \u0111\u1ed3ng b\u1ed9 (Batch Logging Worker).\n*   T\u00edch h\u1ee3p th\u00e0nh c\u00f4ng gi\u1ea3i ph\u00e1p \u0111\u0103ng nh\u1eadp an to\u00e0n kh\u00f4ng m\u1eadt kh\u1ea9u Passkey ch\u1ed1ng phishing t\u00e0i kho\u1ea3n qu\u1ea3n tr\u1ecb.\n*   Thi\u1ebft k\u1ebf c\u00f4ng c\u1ee5 ph\u00e2n t\u00edch \u0111\u1ed9ng t\u00ean mi\u1ec1n l\u1eeba \u0111\u1ea3o k\u1ebft h\u1ee3p Heuristics v\u00e0 AI Gemini c\u00f9ng tr\u1ee3 l\u00fd \u1ea3o h\u1ecfi \u0111\u00e1p Lu\u1eadt An ninh m\u1ea1ng Vi\u1ec7t Nam \u1ee9ng d\u1ee5ng k\u1ef9 thu\u1eadt RAG.\n*   Ti\u1ec7n \u00edch tr\u00ecnh duy\u1ec7t t\u00edch h\u1ee3p c\u00e1c b\u1ed9 l\u1ecdc quy\u1ec1n ri\u00eang t\u01b0 (Data Blur, Translate Shield, GPC) v\u00e0 c\u00e1c c\u00f4ng c\u1ee5 d\u1ecdn d\u1eb9p qu\u1ea3ng c\u00e1o, qu\u1ea3n l\u00fd th\u1eddi gian tr\u00ean Facebook ho\u1ea1t \u0111\u1ed9ng hi\u1ec7u qu\u1ea3.\n\n### 2. H\u1ea1n ch\u1ebf v\u00e0 H\u01b0\u1edbng ph\u00e1t tri\u1ec3n t\u01b0\u01a1ng lai\n*   *H\u1ea1n ch\u1ebf*: B\u1ed9 l\u1ecdc Cuckoo Filter l\u01b0u tr\u00ean RAM hi\u1ec7n t\u1ea1i c\u1ea7n c\u01a1 ch\u1ebf \u0111\u1ed3ng b\u1ed9 ph\u00e2n t\u00e1n (Distributed Sync) n\u1ebfu tri\u1ec3n khai Backend tr\u00ean nhi\u1ec1u c\u1ee5m m\u00e1y ch\u1ee7 kh\u00e1c nhau (m\u00f4i tr\u01b0\u1eddng Cluster).\n*   *H\u01b0\u1edbng ph\u00e1t tri\u1ec3n*:\n    *   Nghi\u00ean c\u1ee9u t\u00edch h\u1ee3p Redis l\u00e0m b\u1ed9 nh\u1edb \u0111\u1ec7m ph\u00e2n t\u00e1n \u0111\u1ec3 h\u1ed7 tr\u1ee3 Cuckoo Filter khi m\u1edf r\u1ed9ng quy m\u00f4.\n    *   T\u1ed1i \u01b0u h\u00f3a t\u1eadp d\u1eef li\u1ec7u nh\u00fang (Embeddings) c\u1ee7a kho lu\u1eadt an ninh m\u1ea1ng, t\u00edch h\u1ee3p th\u00eam nhi\u1ec1u ngh\u1ecb \u0111\u1ecbnh x\u1eed ph\u1ea1t m\u1edbi \u0111\u1ec3 chatbot tr\u1ea3 l\u1eddi ch\u00ednh x\u00e1c h\u01a1n.\n    *   Ph\u00e1t tri\u1ec3n th\u00eam phi\u00ean b\u1ea3n ti\u1ec7n \u00edch m\u1edf r\u1ed9ng cho c\u00e1c h\u1ec7 \u0111i\u1ec1u h\u00e0nh di \u0111\u1ed9ng (iOS/Android Safari Extensions) \u0111\u1ec3 b\u1ea3o v\u1ec7 ng\u01b0\u1eddi d\u00f9ng tr\u00ean \u0111i\u1ec7n tho\u1ea1i th\u00f4ng minh.\n";

        mermaid.initialize({ 
            startOnLoad: false, 
            theme: 'default',
            securityLevel: 'loose'
        });

        const renderer = new marked.Renderer();
        const origCode = renderer.code.bind(renderer);
        renderer.code = function(code, language) {
            if (language === 'mermaid') {
                return `<div class="mermaid">${code}</div>`;
            }
            return origCode(code, language);
        };

        marked.setOptions({ renderer: renderer });
        document.getElementById('content').innerHTML = marked.parse(rawMarkdown);
        
        setTimeout(() => {
            mermaid.run({ querySelector: '.mermaid' });
        }, 300);
    </script>
